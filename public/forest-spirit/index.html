<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060908">
<meta name="description" content="Кінематографічна інтерактивна сцена з однієї фотографії: жива природа, глибина, магічний портал і три стани доби. Чистий HTML, CSS і JavaScript.">
<title>Дух лісу</title>
<style>
/* Layout: a full-bleed WebGL stage. The title sits top-left, the time-of-day switch and the
   magic button float bottom-centre on smoked glass, the quote appears beside the portrait. */
:root {
  color-scheme: dark;
  --night: #060908;                        /* stage background: forest at the edge of the frame */
  --ink: #f4efe4;                          /* warm paper white */
  --ink-dim: rgba(244, 239, 228, 0.66);
  --ink-faint: rgba(244, 239, 228, 0.16);
  --glass: rgba(10, 16, 13, 0.38);
  --glass-hover: rgba(244, 239, 228, 0.08);
  --gold: #ecd29b;                         /* late sunlight, the accent */
  --gold-line: rgba(236, 210, 155, 0.5);
  --font-display: "Cormorant Garamond", "Cormorant", "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --edge: clamp(16px, 3.2vw, 44px);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}

html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-ui);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
[hidden] { display: none !important; }

#stage {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  display: block;
  touch-action: none;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.6s ease;
}
.is-live #stage { opacity: 1; }
#photo-source { display: none; }

/* ---------- title ---------- */
.title {
  position: fixed;
  top: calc(var(--safe-t) + var(--edge));
  left: calc(var(--safe-l) + var(--edge));
  margin: 0;
  pointer-events: none;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 1.6s ease 0.4s, transform 1.6s ease 0.4s;
}
.is-live .title { opacity: 1; transform: none; }
.eyebrow {
  margin: 0 0 10px;
  font: 600 10.5px/1.3 var(--font-ui);
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.title h1 {
  margin: 0;
  font: italic 400 clamp(36px, 4.4vw, 66px)/0.95 var(--font-display);
  letter-spacing: -0.005em;
  text-shadow: 0 2px 28px rgba(0, 0, 0, 0.5);
}

/* ---------- corner controls ---------- */
.corner {
  position: fixed;
  top: calc(var(--safe-t) + var(--edge));
  right: calc(var(--safe-r) + var(--edge));
  display: flex; gap: 8px;
  opacity: 0;
  transition: opacity 1.2s ease 1s;
}
.is-live .corner { opacity: 1; }

/* ---------- shared pill buttons ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 40px;
  padding: 0 16px;
  border: 1px solid var(--ink-faint);
  border-radius: 999px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px) saturate(1.3);
  backdrop-filter: blur(14px) saturate(1.3);
  color: var(--ink);
  font: 500 13px/1 var(--font-ui);
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
}
.pill:hover { background: var(--glass-hover); }
.pill svg { width: 16px; height: 16px; flex: none; }
button { touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
#sound[aria-pressed="true"] { border-color: var(--gold-line); color: var(--gold); }

/* ---------- dock: time of day + magic ---------- */
.dock {
  position: fixed;
  left: 50%;
  bottom: calc(var(--safe-b) + var(--edge));
  transform: translate(-50%, 8px);
  display: flex; align-items: center; gap: 10px;
  opacity: 0;
  transition: opacity 1.4s ease 1.2s, transform 1.4s ease 1.2s;
}
.is-live .dock { opacity: 1; transform: translate(-50%, 0); }
.looks {
  display: flex; gap: 2px;
  padding: 4px;
  border: 1px solid var(--ink-faint);
  border-radius: 999px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px) saturate(1.3);
  backdrop-filter: blur(14px) saturate(1.3);
}
.looks button {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 38px;
  padding: 0 16px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink-dim);
  font: 500 13px/1 var(--font-ui);
  letter-spacing: 0.02em;
  white-space: nowrap;
  cursor: pointer;
  transition: background 0.4s ease, color 0.4s ease;
}
.looks button:hover { color: var(--ink); }
.looks button[aria-pressed="true"] { background: rgba(244, 239, 228, 0.14); color: var(--ink); }
.looks svg { width: 16px; height: 16px; flex: none; }
.magic { border-color: var(--gold-line); color: var(--gold); min-height: 46px; padding: 0 20px; white-space: nowrap; }
.magic:disabled { opacity: 0.45; cursor: default; }
.magic[aria-pressed="true"] { background: rgba(236, 210, 155, 0.16); }
.magic svg { transition: transform 0.8s ease; }
.magic[aria-pressed="true"] svg { transform: rotate(45deg) scale(1.1); }

/* ---------- hint ---------- */
.hint {
  position: fixed;
  left: 50%;
  bottom: calc(var(--safe-b) + var(--edge) + 64px);
  transform: translateX(-50%);
  width: min(92vw, 520px);
  margin: 0;
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1.2s ease;
}
.is-ready .hint { opacity: 1; transition-delay: 3.2s; }
.is-awake .hint { opacity: 0.8; transition-delay: 0s; }
.quote-on .hint { opacity: 0; transition-delay: 0s; }
.hint .primary {
  display: block;
  font: italic 400 clamp(19px, 1.7vw, 23px)/1.25 var(--font-display);
  text-shadow: 0 1px 18px rgba(0, 0, 0, 0.6);
}
.hint .secondary {
  display: block;
  margin-top: 6px;
  font: 600 10px/1.4 var(--font-ui);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-dim);
  text-shadow: 0 1px 12px rgba(0, 0, 0, 0.6);
}

/* ---------- quote ---------- */
.quote {
  position: fixed;
  right: calc(var(--safe-r) + var(--edge) + 1vw);
  top: 50%;
  width: min(26vw, 340px);
  margin: 0;
  transform: translateY(-40%);
  pointer-events: none;
  opacity: 0;
  filter: blur(6px);
  transition: opacity 2.2s ease, filter 2.2s ease, transform 2.2s ease;
}
.quote.is-visible { opacity: 1; filter: blur(0); transform: translateY(-50%); }
.quote p {
  margin: 0;
  font: italic 400 clamp(24px, 2.3vw, 34px)/1.18 var(--font-display);
  text-wrap: balance;
  text-shadow: 0 2px 24px rgba(0, 0, 0, 0.55);
}
.quote footer {
  margin-top: 14px;
  font: 600 10px/1.5 var(--font-ui);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
}

/* ---------- loader and fallback ---------- */
.loader {
  position: fixed; left: 50%; top: 50%;
  width: 120px; height: 1px;
  transform: translate(-50%, -50%);
  background: var(--ink-faint);
  overflow: hidden;
  pointer-events: none;
  transition: opacity 0.6s ease, visibility 0s linear 0.6s;
}
.loader::after {
  content: ""; position: absolute; inset: 0;
  background: var(--gold);
  transform: translateX(-100%);
  animation: sweep 1.4s ease-in-out infinite;
}
@keyframes sweep { to { transform: translateX(100%); } }
.is-live .loader { opacity: 0; visibility: hidden; }
.fallback-note {
  position: fixed; left: 50%; top: calc(var(--safe-t) + 50%);
  transform: translate(-50%, -50%);
  max-width: 34ch;
  margin: 0;
  text-align: center;
  font: 400 15px/1.5 var(--font-ui);
  color: var(--ink-dim);
}
.no-webgl #stage, .no-webgl .loader, .no-webgl .dock, .no-webgl .hint, .no-webgl .corner { display: none; }
.no-webgl #photo-source {
  display: block;
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  object-fit: contain;
  opacity: 0.35;
}
.no-webgl .title { opacity: 1; transform: none; }

/* ---------- narrow screens ---------- */
@media (max-width: 900px) {
  .quote {
    left: 50%; right: auto; top: auto;
    bottom: calc(var(--safe-b) + var(--edge) + 60px);
    width: min(88vw, 420px);
    text-align: center;
    transform: translate(-50%, 8px);
  }
  .quote.is-visible { transform: translate(-50%, 0); }
  .quote p { font-size: clamp(21px, 5.4vw, 28px); }
}
@media (max-width: 640px) {
  .dock { flex-direction: column-reverse; gap: 8px; width: calc(100vw - 32px); }
  .looks { width: 100%; }
  .looks button { flex: 1; justify-content: center; padding: 0 6px; gap: 6px; font-size: 12.5px; }
  .hint { bottom: calc(var(--safe-b) + var(--edge) + 112px); }
  .quote { bottom: calc(var(--safe-b) + var(--edge) + 112px); }
  .corner .pill .label { display: none; }
  .corner .pill { padding: 0 12px; }
}
@media (max-width: 370px) {
  .looks svg { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01s !important; animation: none !important; }
}
</style>
</head>
<body>
<canvas id="stage" aria-label="Інтерактивна сцена: дівчина серед літнього лісу. Клацніть або торкніться, щоб пробудити магію."></canvas>
<div class="loader" aria-hidden="true"></div>

<header class="title">
  <p class="eyebrow">Одна фотографія · чистий код</p>
  <h1>Дух лісу</h1>
</header>

<div class="corner">
  <button class="pill" id="sound" type="button" aria-pressed="false">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6h2.2L8 3.2v9.6L4.7 10H2.5z"/><path d="M10.6 5.6a3.4 3.4 0 0 1 0 4.8M12.4 3.9a5.8 5.8 0 0 1 0 8.2"/></svg>
    <span class="label">Звук</span>
  </button>
</div>

<blockquote class="quote" id="quote" aria-live="polite">
  <p>«Я в серці маю те, що не вмирає»</p>
  <footer>Леся Українка · «Лісова пісня»</footer>
</blockquote>

<p class="hint" id="hint"><span class="primary">Клацніть, щоб пробудити магію</span><span class="secondary">Рухайте мишею, щоб зазирнути вглиб сцени</span></p>

<nav class="dock" aria-label="Керування сценою">
  <div class="looks" role="group" aria-label="Час доби">
    <button type="button" data-look="day" aria-pressed="true">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>
      Полудень
    </button>
    <button type="button" data-look="dusk" aria-pressed="false">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M4.6 11a3.4 3.4 0 0 1 6.8 0"/><path d="M1.5 11h13M3.2 13.4h9.6M8 3.4V5M2.9 6.1l1.1 1M13.1 6.1l-1.1 1"/></svg>
      Золота година
    </button>
    <button type="button" data-look="night" aria-pressed="false">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.8 10.2A5.4 5.4 0 0 1 5.8 3.2a5.4 5.4 0 1 0 7 7z"/><path d="M11.5 2.2v1.6M10.7 3h1.6"/></svg>
      Ніч
    </button>
  </div>
  <button class="pill magic" id="magic" type="button" aria-pressed="false" disabled>
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0.8c.4 3.6 1.9 5.9 7.2 7.2-5.3 1.3-6.8 3.6-7.2 7.2-.4-3.6-1.9-5.9-7.2-7.2C6.1 6.7 7.6 4.4 8 .8z"/></svg>
    <span class="label">Пробудити магію</span>
  </button>
</nav>

<noscript><style>#photo-source { display: block; position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; } .loader, .dock, .corner { display: none; } .title { opacity: 1; transform: none; }</style></noscript>
<p class="fallback-note" id="fallback-note" hidden>Цей браузер не підтримує WebGL, тому магія недоступна. Спробуйте відкрити сторінку в сучасному Chrome, Safari або Firefox.</p>

<script>
/* =========================================================================
   Photo analysis kernel: hand-traced silhouette -> alpha matte, clean plate,
   depth / wind / hair / sky maps, packed into RGBA textures.
   Pure computation (no DOM), so it runs inside a Web Worker built from
   PhotoAnalysis.toString(), or on the main thread as a fallback.
   ========================================================================= */
function PhotoAnalysis() {
  'use strict';

  // Outer silhouette of the girl in photo pixels, traced by hand (clockwise from the crown).
  const SILHOUETTE = [
    [300, 82], [310, 76], [320, 73], [330, 72], [340, 72], [348, 74], [355, 78], [360, 83], [363, 90],
    [365, 97], [366, 105], [367, 115], [368, 125], [369, 140], [370, 155], [371, 170], [372, 185],
    [373, 200], [375, 210], [380, 218], [388, 224], [396, 228], [402, 233], [410, 239], [418, 246],
    [425, 254], [430, 263], [434, 273], [437, 284], [440, 296], [443, 308], [447, 320], [451, 330],
    [454, 345], [456, 360], [456, 375], [454, 390], [451, 403], [447, 415], [443, 428], [440, 440],
    [437, 450], [433, 458], [429, 464], [431, 472], [434, 483], [437, 495], [440, 510], [442, 525],
    [443, 540], [444, 560], [445, 580], [445, 600], [446, 620], [447, 646], [333, 646], [328, 600],
    [322, 575], [319, 565], [313, 580], [307, 600], [300, 620], [295, 646], [174, 646], [180, 630],
    [185, 620], [190, 610], [195, 600], [200, 590], [207, 580], [212, 570], [217, 560], [222, 550],
    [228, 540], [233, 530], [238, 520], [243, 510], [245, 500], [246, 490], [249, 482], [252, 474],
    [255, 462], [256, 450], [250, 442], [240, 437], [232, 438], [225, 434], [225, 420], [226, 400],
    [227, 380], [228, 360], [228, 340], [228, 320], [229, 300], [230, 285], [230, 275], [225, 272],
    [215, 273], [205, 272], [195, 268], [185, 262], [175, 255], [166, 245], [160, 236], [157, 228],
    [157, 220], [160, 214], [166, 207], [175, 200], [190, 190], [210, 180], [225, 173], [235, 166],
    [242, 160], [248, 152], [252, 145], [256, 137], [260, 130], [264, 124], [268, 118], [271, 113],
    [274, 109], [276, 104], [278, 99], [281, 93], [285, 88], [290, 85], [295, 83],
  ];

  // Background seen through the silhouette, between the right arm and the waist.
  const HOLES = [
    [[393, 313], [398, 320], [403, 327], [408, 335], [412, 344], [416, 353], [420, 362], [422, 372],
     [422.5, 385], [422, 398], [420.5, 410], [419, 421], [417, 430], [415, 433], [412, 427], [409, 417],
     [406, 405], [403, 393], [399, 381], [394, 371], [388, 363], [382, 356], [383, 347], [385, 337],
     [388, 327], [390, 319]],
  ];

  // Face and neck: excluded from every displacement.
  const FACE = [[296, 100], [330, 94], [358, 104], [362, 150], [355, 188], [340, 206], [334, 228],
    [306, 228], [300, 204], [292, 180], [290, 140]];

  // Loose hair on the right side, falling over the shoulder: it gets a gentle breeze.
  const HAIR = [[356, 92], [368, 96], [374, 140], [376, 196], [386, 214], [402, 228], [410, 246],
    [404, 270], [386, 272], [366, 258], [352, 238], [350, 210], [358, 180], [362, 140]];

  const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
  const smoothstep = (a, b, v) => { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };

  /* ---------- raster helpers ---------- */

  // Anti-aliased even-odd scanline fill of one or more polygons (4 sub-rows per pixel).
  function rasterize(polys, W, H) {
    const out = new Float32Array(W * H);
    const SUB = 4, w = 1 / SUB, xs = [];
    for (let y = 0; y < H; y++) {
      const row = y * W;
      for (let s = 0; s < SUB; s++) {
        const sy = y + (s + 0.5) / SUB;
        xs.length = 0;
        for (const poly of polys) {
          for (let i = 0, n = poly.length; i < n; i++) {
            const a = poly[i], b = poly[(i + 1) % n];
            if ((a[1] <= sy && b[1] > sy) || (b[1] <= sy && a[1] > sy)) {
              xs.push(a[0] + ((sy - a[1]) / (b[1] - a[1])) * (b[0] - a[0]));
            }
          }
        }
        xs.sort((p, q) => p - q);
        for (let k = 0; k + 1 < xs.length; k += 2) {
          const xa = Math.max(0, Math.min(W, xs[k])), xb = Math.max(0, Math.min(W, xs[k + 1]));
          if (xb <= xa) continue;
          const ia = Math.floor(xa), ib = Math.floor(xb);
          if (ia === ib) { out[row + ia] += (xb - xa) * w; continue; }
          out[row + ia] += (ia + 1 - xa) * w;
          for (let x = ia + 1; x < ib; x++) out[row + x] += w;
          if (ib < W) out[row + ib] += (xb - ib) * w;
        }
      }
    }
    return out;
  }

  // Separable box blur (edge-clamped) on `ch` interleaved channels; 3 passes ~ Gaussian.
  function boxBlur(src, W, H, ch, radius, passes = 3) {
    const r = Math.round(radius);
    if (r < 1) return src.slice();
    const a = src.slice(), b = new Float32Array(src.length);
    const norm = 1 / (2 * r + 1);
    const line = new Float32Array(Math.max(W, H) + 2 * r + 1);
    const run = (from, to, len, stride, offset) => {
      for (let c = 0; c < ch; c++) {
        for (let k = 0; k < len + 2 * r; k++) {
          const s = k < r ? 0 : k - r >= len ? len - 1 : k - r;
          line[k] = from[offset + s * stride + c];
        }
        let acc = 0;
        for (let k = 0; k <= 2 * r; k++) acc += line[k];
        for (let k = 0; k < len; k++) {
          to[offset + k * stride + c] = acc * norm;
          acc += line[k + 2 * r + 1] - line[k];
        }
      }
    };
    for (let p = 0; p < passes; p++) {
      for (let y = 0; y < H; y++) run(a, b, W, ch, y * W * ch);
      for (let x = 0; x < W; x++) run(b, a, H, W * ch, x * ch);
    }
    return a;
  }

  // Box-downsample `ch`-channel data by an integer factor.
  function downsample(src, W, H, ch, f) {
    const w = Math.ceil(W / f), h = Math.ceil(H / f), out = new Float32Array(w * h * ch);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const o = (y * w + x) * ch;
        let n = 0;
        for (let oy = 0; oy < f; oy++) {
          const sy = y * f + oy;
          if (sy >= H) break;
          for (let ox = 0; ox < f; ox++) {
            const sx = x * f + ox;
            if (sx >= W) break;
            const i = (sy * W + sx) * ch;
            for (let c = 0; c < ch; c++) out[o + c] += src[i + c];
            n++;
          }
        }
        for (let c = 0; c < ch; c++) out[o + c] /= n;
      }
    }
    return { data: out, w, h };
  }

  // Bilinear upsample back to W x H.
  function upsample(src, w, h, ch, W, H) {
    const out = new Float32Array(W * H * ch), fx = w / W, fy = h / H;
    for (let y = 0; y < H; y++) {
      const v = Math.min(h - 1, Math.max(0, (y + 0.5) * fy - 0.5));
      const y0 = Math.floor(v), y1 = Math.min(h - 1, y0 + 1), ty = v - y0;
      for (let x = 0; x < W; x++) {
        const u = Math.min(w - 1, Math.max(0, (x + 0.5) * fx - 0.5));
        const x0 = Math.floor(u), x1 = Math.min(w - 1, x0 + 1), tx = u - x0;
        const o = (y * W + x) * ch;
        for (let c = 0; c < ch; c++) {
          const top = src[(y0 * w + x0) * ch + c] * (1 - tx) + src[(y0 * w + x1) * ch + c] * tx;
          const bot = src[(y1 * w + x0) * ch + c] * (1 - tx) + src[(y1 * w + x1) * ch + c] * tx;
          out[o + c] = top * (1 - ty) + bot * ty;
        }
      }
    }
    return out;
  }

  // Wide blurs of smooth maps are done at reduced resolution.
  function wideBlur(src, W, H, ch, radius, f) {
    const s = downsample(src, W, H, ch, f);
    return upsample(boxBlur(s.data, s.w, s.h, ch, radius / f), s.w, s.h, ch, W, H);
  }

  // Two-pass chamfer distance (px) to the nearest pixel on the other side of the mask.
  function distanceTransform(mask, W, H, inside) {
    const d = new Float32Array(W * H), D = Math.SQRT2;
    for (let i = 0; i < d.length; i++) d[i] = (mask[i] >= 0.5) === inside ? 1e9 : 0;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        let v = d[i];
        if (v === 0) continue;
        if (x > 0) v = Math.min(v, d[i - 1] + 1);
        if (y > 0) {
          v = Math.min(v, d[i - W] + 1);
          if (x > 0) v = Math.min(v, d[i - W - 1] + D);
          if (x < W - 1) v = Math.min(v, d[i - W + 1] + D);
        }
        d[i] = v;
      }
    }
    for (let y = H - 1; y >= 0; y--) {
      for (let x = W - 1; x >= 0; x--) {
        const i = y * W + x;
        let v = d[i];
        if (v === 0) continue;
        if (x < W - 1) v = Math.min(v, d[i + 1] + 1);
        if (y < H - 1) {
          v = Math.min(v, d[i + W] + 1);
          if (x < W - 1) v = Math.min(v, d[i + W + 1] + D);
          if (x > 0) v = Math.min(v, d[i + W - 1] + D);
        }
        d[i] = v;
      }
    }
    return d;
  }

  /* ---------- alpha matting ---------- */

  // Colour priors for this scene: foliage is green or yellow-green and the sky is bright.
  // Skin, hair and white cotton never look like that, so such pixels in the edge band are background.
  function backgroundLikeness(r, g, b, y) {
    const green = g - Math.max(r, b);
    const yellow = Math.min(r, g) - b;
    const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    // Around the head (above the shoulders) a bright pixel that is not skin is sky or a sunlit leaf.
    const sky = y < 205 ? smoothstep(0.5, 0.62, lum) * smoothstep(-0.03, 0.01, g - r) : 0;
    const darkLeaf = smoothstep(0.015, 0.05, g - r) * (1 - smoothstep(0.3, 0.45, lum));
    return Math.max(smoothstep(0.025, 0.075, green), smoothstep(0.17, 0.27, yellow), sky, darkLeaf);
  }

  // Trimap from the traced outline, then per-pixel sampling in the unknown band: rays collect
  // nearby known foreground / background colours and the pair that best explains the pixel as
  // a linear blend wins (after Gastal & Oliveira, "Shared Sampling for Real-Time Alpha Matting").
  function computeMatte(rgb, W, H) {
    const N = W * H;
    const shape = rasterize([SILHOUETTE, ...HOLES], W, H);
    const dIn = distanceTransform(shape, W, H, true);
    const dOut = distanceTransform(shape, W, H, false);

    const BAND = 6;
    const tri = new Uint8Array(N); // 2 = sure foreground, 0 = sure background, 1 = unknown
    for (let i = 0; i < N; i++) tri[i] = dIn[i] > BAND ? 2 : dOut[i] > BAND ? 0 : 1;
    for (let y = H - 3; y < H; y++) {   // the frame edge cuts through the legs: keep it solid
      for (let x = 0; x < W; x++) if (shape[y * W + x] >= 0.5) tri[y * W + x] = 2;
    }

    const alpha = new Float32Array(N);
    const fg = rgb.slice();
    for (let i = 0; i < N; i++) alpha[i] = tri[i] === 2 ? 1 : 0;

    const RAYS = 16, MAXLEN = BAND * 3 + 2;
    const cosT = new Float32Array(RAYS * 4), sinT = new Float32Array(RAYS * 4);
    for (let k = 0; k < RAYS * 4; k++) {
      const a = (k / (RAYS * 4)) * Math.PI * 2;
      cosT[k] = Math.cos(a); sinT[k] = Math.sin(a);
    }
    const fs = new Int32Array(RAYS * 2), bs = new Int32Array(RAYS * 2);
    const fsd = new Float32Array(RAYS * 2), bsd = new Float32Array(RAYS * 2);

    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        if (tri[i] !== 1) continue;
        let nf = 0, nb = 0;
        const rot = (x * 3 + y * 5) & 3;        // rotate the ray fan per pixel
        for (let k = 0; k < RAYS; k++) {
          const dx = cosT[k * 4 + rot], dy = sinT[k * 4 + rot];
          for (let s = 1; s <= MAXLEN; s++) {
            const sx = (x + dx * s + 0.5) | 0, sy = (y + dy * s + 0.5) | 0;
            if (sx < 0 || sy < 0 || sx >= W || sy >= H) break;
            const t = tri[sy * W + sx];
            if (t === 1) continue;
            for (let e = 0; e < 2; e++) {       // the hit, and a pixel a little deeper
              const ex = (x + dx * (s + e * 4) + 0.5) | 0, ey = (y + dy * (s + e * 4) + 0.5) | 0;
              if (ex < 0 || ey < 0 || ex >= W || ey >= H) break;
              const j = ey * W + ex;
              if (tri[j] !== t) break;
              if (t === 2) { fs[nf] = j; fsd[nf++] = s + e * 4; } else { bs[nb] = j; bsd[nb++] = s + e * 4; }
            }
            break;
          }
        }
        const cr = rgb[i * 3], cg = rgb[i * 3 + 1], cb = rgb[i * 3 + 2];
        if (!nf || !nb) { alpha[i] = nf ? 1 : 0; continue; }

        // How close the pixel colour is to the foreground vs. the background samples.
        let dF = Infinity, dB = Infinity;
        for (let a = 0; a < nf; a++) {
          const f = fs[a] * 3, er = cr - rgb[f], eg = cg - rgb[f + 1], eb = cb - rgb[f + 2];
          dF = Math.min(dF, er * er + eg * eg + eb * eb);
        }
        for (let b = 0; b < nb; b++) {
          const q = bs[b] * 3, er = cr - rgb[q], eg = cg - rgb[q + 1], eb = cb - rgb[q + 2];
          dB = Math.min(dB, er * er + eg * eg + eb * eb);
        }
        const pF = dB / (dF + dB + 1e-6);

        let best = Infinity, bestA = 0, bestF = fs[0], bestB = bs[0];
        for (let a = 0; a < nf; a++) {
          const f = fs[a] * 3, fr = rgb[f], fgc = rgb[f + 1], fb = rgb[f + 2];
          for (let b = 0; b < nb; b++) {
            const q = bs[b] * 3, br = rgb[q], bgc = rgb[q + 1], bb = rgb[q + 2];
            const er = fr - br, eg = fgc - bgc, eb = fb - bb;
            const den = er * er + eg * eg + eb * eb + 1e-6;
            let al = ((cr - br) * er + (cg - bgc) * eg + (cb - bb) * eb) / den;
            al = al < 0 ? 0 : al > 1 ? 1 : al;
            const rr = cr - (al * fr + (1 - al) * br);
            const rg = cg - (al * fgc + (1 - al) * bgc);
            const rb = cb - (al * fb + (1 - al) * bb);
            const cost = Math.sqrt(rr * rr + rg * rg + rb * rb)
              + 0.12 * (pF + (1 - 2 * pF) * al)       // agree with the pixel's own affinity
              + 0.003 * (fsd[a] + bsd[b])             // prefer nearby samples
              + 0.03 / (Math.sqrt(den) + 0.03);       // distrust near-identical pairs
            if (cost < best) { best = cost; bestA = al; bestF = fs[a]; bestB = bs[b]; }
          }
        }
        alpha[i] = bestA * (1 - backgroundLikeness(cr, cg, cb, y));
        // Decontaminated colour: unmix the background out of C = aF + (1 - a)B.
        // At low alpha the unmixing is unstable, so fall back to the matched foreground sample.
        const f = bestF * 3, q = bestB * 3, ia = 1 / Math.max(bestA, 0.25);
        const t = smoothstep(0.15, 0.6, bestA);
        for (let c = 0; c < 3; c++) {
          const un = clamp01((rgb[i * 3 + c] - (1 - bestA) * rgb[q + c]) * ia);
          fg[i * 3 + c] = rgb[f + c] * (1 - t) + un * t;
        }
      }
    }

    // Clean the band: 3x3 mean, an opening (erode + dilate) outside the outline to drop
    // stray specks, then a gentle contrast curve.
    const smooth = alpha.slice();
    for (let y = 1; y < H - 1; y++) {
      for (let x = 1; x < W - 1; x++) {
        const i = y * W + x;
        if (tri[i] !== 1) continue;
        let s = 0;
        for (let o = -W; o <= W; o += W) s += alpha[i + o - 1] + alpha[i + o] + alpha[i + o + 1];
        smooth[i] = s / 9;
      }
    }
    const outside = (i) => tri[i] === 1 && dIn[i] === 0;
    const eroded = smooth.slice();
    for (let y = 1; y < H - 1; y++) {
      for (let x = 1; x < W - 1; x++) {
        const i = y * W + x;
        if (!outside(i)) continue;
        let m = 1;
        for (let o = -W; o <= W; o += W) m = Math.min(m, smooth[i + o - 1], smooth[i + o], smooth[i + o + 1]);
        eroded[i] = m;
      }
    }
    const out = eroded.slice();
    for (let y = 1; y < H - 1; y++) {
      for (let x = 1; x < W - 1; x++) {
        const i = y * W + x;
        if (!outside(i)) continue;
        let m = 0;
        for (let o = -W; o <= W; o += W) m = Math.max(m, eroded[i + o - 1], eroded[i + o], eroded[i + o + 1]);
        out[i] = Math.min(smooth[i], m);
      }
    }
    for (let i = 0; i < N; i++) if (tri[i] === 1) out[i] = smoothstep(0.1, 0.9, out[i]);
    return { alpha: out, fg, shape };
  }

  /* ---------- clean plate: pull-push hole filling ---------- */

  function pullPushFill(rgb, weight, W, H) {
    const levels = [];
    let w = W, h = H;
    let col = new Float32Array(W * H * 3), wt = new Float32Array(W * H);
    for (let i = 0; i < W * H; i++) {
      wt[i] = weight[i];
      for (let c = 0; c < 3; c++) col[i * 3 + c] = rgb[i * 3 + c] * weight[i];
    }
    levels.push({ w, h, col, wt });
    while (w > 1 || h > 1) {                          // pull: premultiplied pyramid
      const nw = Math.max(1, Math.ceil(w / 2)), nh = Math.max(1, Math.ceil(h / 2));
      const nc = new Float32Array(nw * nh * 3), nwt = new Float32Array(nw * nh);
      for (let y = 0; y < nh; y++) {
        for (let x = 0; x < nw; x++) {
          let r = 0, g = 0, b = 0, s = 0;
          for (let oy = 0; oy < 2; oy++) {
            for (let ox = 0; ox < 2; ox++) {
              const j = Math.min(h - 1, y * 2 + oy) * w + Math.min(w - 1, x * 2 + ox);
              r += col[j * 3]; g += col[j * 3 + 1]; b += col[j * 3 + 2]; s += wt[j];
            }
          }
          const k = y * nw + x, norm = s > 1 ? 1 / s : 1;
          nc[k * 3] = r * norm; nc[k * 3 + 1] = g * norm; nc[k * 3 + 2] = b * norm;
          nwt[k] = Math.min(1, s);
        }
      }
      w = nw; h = nh; col = nc; wt = nwt;
      levels.push({ w, h, col, wt });
    }
    for (let l = levels.length - 2; l >= 0; l--) {   // push: fill from the coarser level
      const F = levels[l], C = levels[l + 1];
      for (let y = 0; y < F.h; y++) {
        const v = Math.min(C.h - 1, Math.max(0, (y + 0.5) / 2 - 0.5));
        const y0 = Math.floor(v), y1 = Math.min(C.h - 1, y0 + 1), ty = v - y0;
        for (let x = 0; x < F.w; x++) {
          const k = y * F.w + x, fw = F.wt[k];
          if (fw >= 1) continue;
          const u = Math.min(C.w - 1, Math.max(0, (x + 0.5) / 2 - 0.5));
          const x0 = Math.floor(u), x1 = Math.min(C.w - 1, x0 + 1), tx = u - x0;
          for (let c = 0; c < 3; c++) {
            const top = C.col[(y0 * C.w + x0) * 3 + c] * (1 - tx) + C.col[(y0 * C.w + x1) * 3 + c] * tx;
            const bot = C.col[(y1 * C.w + x0) * 3 + c] * (1 - tx) + C.col[(y1 * C.w + x1) * 3 + c] * tx;
            F.col[k * 3 + c] += (1 - fw) * (top * (1 - ty) + bot * ty);
          }
          F.wt[k] = 1;
        }
      }
    }
    return levels[0].col;
  }

  /* ---------- clean plate, near the silhouette: mirrored texture ---------- */

  // Nearest known pixel for every pixel (two-pass propagation of nearest sites).
  function nearestKnown(known, W, H) {
    const sx = new Int32Array(W * H).fill(-1), sy = new Int32Array(W * H).fill(-1);
    const d2 = new Float32Array(W * H).fill(Infinity);
    for (let y = 0, i = 0; y < H; y++) {
      for (let x = 0; x < W; x++, i++) if (known[i]) { sx[i] = x; sy[i] = y; d2[i] = 0; }
    }
    const relax = (i, x, y, j) => {
      if (sx[j] < 0) return;
      const dx = x - sx[j], dy = y - sy[j], d = dx * dx + dy * dy;
      if (d < d2[i]) { d2[i] = d; sx[i] = sx[j]; sy[i] = sy[j]; }
    };
    for (let pass = 0; pass < 2; pass++) {
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const i = y * W + x;
          if (x > 0) relax(i, x, y, i - 1);
          if (y > 0) {
            relax(i, x, y, i - W);
            if (x > 0) relax(i, x, y, i - W - 1);
            if (x < W - 1) relax(i, x, y, i - W + 1);
          }
        }
      }
      for (let y = H - 1; y >= 0; y--) {
        for (let x = W - 1; x >= 0; x--) {
          const i = y * W + x;
          if (x < W - 1) relax(i, x, y, i + 1);
          if (y < H - 1) {
            relax(i, x, y, i + W);
            if (x < W - 1) relax(i, x, y, i + W + 1);
            if (x > 0) relax(i, x, y, i + W - 1);
          }
        }
      }
    }
    return { sx, sy, d2 };
  }

  // The parallax reveals only a thin strip behind the girl's outline. There the smooth fill
  // is replaced by real texture mirrored across the outline, fading back to the fill deeper in.
  function mirrorFill(rgb, plate, weight, W, H) {
    const known = new Uint8Array(W * H);
    for (let i = 0; i < W * H; i++) known[i] = weight[i] > 0.5 ? 1 : 0;
    const { sx, sy, d2 } = nearestKnown(known, W, H);
    const out = plate.slice();
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        if (known[i] || sx[i] < 0) continue;
        const d = Math.sqrt(d2[i]);
        const k = 1 - smoothstep(12, 28, d);
        if (k <= 0) continue;
        const mx = Math.round(2 * sx[i] - x), my = Math.round(2 * sy[i] - y);
        if (mx < 0 || my < 0 || mx >= W || my >= H) continue;
        const j = my * W + mx;
        if (!known[j]) continue;
        for (let c = 0; c < 3; c++) out[i * 3 + c] = plate[i * 3 + c] * (1 - k) + rgb[j * 3 + c] * k;
      }
    }
    return out;
  }

  /* ---------- everything, packed for the GPU ---------- */

  // pixels: RGBA bytes of the W x H photo. Returns four RGBA8 textures (+ a tiny blurred plate):
  //   photo     rgb = decontaminated colour,  a = girl alpha
  //   plate     rgb = clean plate (girl removed), a = depth (0 far .. 1 near)
  //   plateBlur rgb = blurred clean plate,       a = wide halo around the girl
  //   aux       r = wind, g = hair motion, b = sky, a = tight halo around the girl
  function analyse(pixels, W, H) {
    const N = W * H;
    const rgb = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      rgb[i * 3] = pixels[i * 4] / 255;
      rgb[i * 3 + 1] = pixels[i * 4 + 1] / 255;
      rgb[i * 3 + 2] = pixels[i * 4 + 2] / 255;
    }

    const { alpha, fg, shape } = computeMatte(rgb, W, H);

    // Clean plate: grow the matte a little so no fringe leaks into the fill.
    const grown = boxBlur(alpha, W, H, 1, 2, 2);
    const weight = new Float32Array(N);
    for (let i = 0; i < N; i++) weight[i] = grown[i] > 0.02 ? 0 : 1;
    const plate = mirrorFill(rgb, pullPushFill(rgb, weight, W, H), weight, W, H);

    // Sky: bright bluish pixels in the upper part of the frame. Greenness drives the wind.
    const sky = new Float32Array(N), green = new Float32Array(N);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        const r = plate[i * 3], g = plate[i * 3 + 1], b = plate[i * 3 + 2];
        const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        sky[i] = smoothstep(0.55, 0.72, lum) * smoothstep(0.02, 0.1, b - r) * (1 - smoothstep(0.42, 0.56, y / H));
        green[i] = smoothstep(0.0, 0.08, g - Math.max(r, b));
      }
    }
    const skyS = boxBlur(sky, W, H, 1, 1, 2);

    // Depth, authored from the scene layout: ground plane rising toward the camera, the big
    // tree on the right closer than the trees on the left, the sky at infinity.
    const depth = new Float32Array(N);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x, u = x / W, v = y / H;
        let d = 0.22 + 0.62 * smoothstep(0.42, 1.0, v);
        const rightTree = smoothstep(0.52, 0.7, u) * (1 - smoothstep(0.7, 0.95, v));
        d = Math.max(d, rightTree * (0.52 + 0.14 * (1 - v)));
        const leftTrees = (1 - smoothstep(0.25, 0.45, u)) * (1 - smoothstep(0.45, 0.62, v));
        d *= 1 - 0.3 * leftTrees;
        depth[i] = d * (1 - skyS[i]);
      }
    }
    const depthS = wideBlur(depth, W, H, 1, 16, 4);

    // Wind: foliage sways, strongest in the canopy, gentle on the grass, none on the girl.
    const girlNear = wideBlur(shape, W, H, 1, 6, 2);
    const wind = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const v = Math.floor(i / W) / H;
      wind[i] = green[i] * (1 - 0.7 * smoothstep(0.5, 0.75, v)) * (1 - Math.min(1, girlNear[i] * 1.5));
    }
    const windS = wideBlur(wind, W, H, 1, 4, 2);

    // Hair: soft region, more motion toward the tips, the face is protected.
    const hairS = wideBlur(rasterize([HAIR], W, H), W, H, 1, 5, 2);
    const faceS = wideBlur(rasterize([FACE], W, H), W, H, 1, 4, 2);
    const hair = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const y = Math.floor(i / W);
      hair[i] = hairS[i] * (0.2 + 0.8 * smoothstep(150, 262, y)) * (1 - Math.min(1, faceS[i] * 1.6));
    }

    const haloS = boxBlur(alpha, W, H, 1, 5, 3);
    const haloL = wideBlur(alpha, W, H, 1, 20, 2);
    const plateBlur = wideBlur(plate, W, H, 3, 6, 2);

    const to8 = (v) => (v <= 0 ? 0 : v >= 1 ? 255 : (v * 255 + 0.5) | 0);
    const photoTex = new Uint8Array(N * 4), plateTex = new Uint8Array(N * 4);
    const blurTex = new Uint8Array(N * 4), auxTex = new Uint8Array(N * 4);
    for (let i = 0; i < N; i++) {
      const o = i * 4;
      for (let c = 0; c < 3; c++) {
        photoTex[o + c] = to8(fg[i * 3 + c]);
        plateTex[o + c] = to8(plate[i * 3 + c]);
        blurTex[o + c] = to8(plateBlur[i * 3 + c]);
      }
      photoTex[o + 3] = to8(alpha[i]);
      plateTex[o + 3] = to8(depthS[i]);
      blurTex[o + 3] = to8(haloL[i]);
      auxTex[o] = to8(windS[i]);
      auxTex[o + 1] = to8(hair[i]);
      auxTex[o + 2] = to8(skyS[i]);
      auxTex[o + 3] = to8(haloS[i]);
    }

    // A tiny, heavily blurred plate for the soft surroundings beyond the photo's edges.
    const TINY = 64;
    const tinySrc = downsample(plate, W, H, 3, W / TINY);
    const tiny = boxBlur(tinySrc.data, TINY, TINY, 3, 3, 3);
    const tinyTex = new Uint8Array(TINY * TINY * 4);
    for (let i = 0; i < TINY * TINY; i++) {
      for (let c = 0; c < 3; c++) tinyTex[i * 4 + c] = to8(tiny[i * 3 + c]);
      tinyTex[i * 4 + 3] = 255;
    }

    return { W, H, photo: photoTex, plate: plateTex, plateBlur: blurTex, aux: auxTex, tiny: tinyTex, tinySize: TINY };
  }

  return { analyse, SILHOUETTE };
}

<script>
/* =========================================================================
   WebGL plumbing: programs with typed uniform setters, textures, targets.
   ========================================================================= */
const Engine = (() => {
  'use strict';

  function compile(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS) && !gl.isContextLost()) {
      const log = gl.getShaderInfoLog(shader);
      gl.deleteShader(shader);
      throw new Error('Shader compile error: ' + log);
    }
    return shader;
  }

  // Links a program and builds setters for its active uniforms. Samplers get a
  // texture unit each and accept a WebGLTexture directly.
  function program(gl, vsSource, fsSource) {
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, vsSource));
    gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS) && !gl.isContextLost()) {
      throw new Error('Program link error: ' + gl.getProgramInfoLog(prog));
    }
    const attribs = {};
    const nA = gl.getProgramParameter(prog, gl.ACTIVE_ATTRIBUTES);
    for (let i = 0; i < nA; i++) {
      const info = gl.getActiveAttrib(prog, i);
      attribs[info.name] = gl.getAttribLocation(prog, info.name);
    }
    const setters = {};
    let unit = 0;
    const nU = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < nU; i++) {
      const info = gl.getActiveUniform(prog, i);
      const loc = gl.getUniformLocation(prog, info.name);
      switch (info.type) {
        case gl.FLOAT: setters[info.name] = (v) => gl.uniform1f(loc, v); break;
        case gl.FLOAT_VEC2: setters[info.name] = (v) => gl.uniform2fv(loc, v); break;
        case gl.FLOAT_VEC3: setters[info.name] = (v) => gl.uniform3fv(loc, v); break;
        case gl.FLOAT_VEC4: setters[info.name] = (v) => gl.uniform4fv(loc, v); break;
        case gl.SAMPLER_2D: {
          const u = unit++;
          setters[info.name] = (tex) => {
            gl.activeTexture(gl.TEXTURE0 + u);
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.uniform1i(loc, u);
          };
          break;
        }
        default: setters[info.name] = (v) => gl.uniform1f(loc, v);
      }
    }
    return {
      attribs,
      use() { gl.useProgram(prog); return this; },
      set(values) {
        for (const k in values) if (setters[k]) setters[k](values[k]);
        return this;
      },
    };
  }

  function texture(gl, width, height, data, { filter = gl.LINEAR, wrap = gl.CLAMP_TO_EDGE } = {}) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, data || null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
    return tex;
  }

  function upload(gl, tex, width, height, data) {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  }

  // An offscreen colour target (RGBA8, linear, clamped).
  function target(gl) {
    const t = { tex: texture(gl, 1, 1, null), fb: gl.createFramebuffer(), w: 1, h: 1 };
    gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t.tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    t.resize = (w, h) => {
      w = Math.max(1, Math.round(w)); h = Math.max(1, Math.round(h));
      if (w === t.w && h === t.h) return;
      t.w = w; t.h = h;
      gl.bindTexture(gl.TEXTURE_2D, t.tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    };
    return t;
  }

  function bindTarget(gl, t, width, height) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, t ? t.fb : null);
    gl.viewport(0, 0, t ? t.w : width, t ? t.h : height);
  }

  return { program, texture, upload, target, bindTarget };
})();
