<script>
/* =========================================================================
   GLSL (WebGL 1 / GLSL ES 1.00)
   Coordinates: "photo uv" has (0,0) at the photo's top-left corner and (1,1)
   at its bottom-right. uRect places the photo in framebuffer pixels
   (origin xy measured from the top-left, size zw).
   ========================================================================= */
const SHADERS = (() => {
  const COMMON = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
#define PIVOT 0.55
#define GIRL_DEPTH 0.62
#define ENC 0.5
float hash12(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float luma(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
`;

  const FULLSCREEN_VS = `
attribute vec2 aPos;
varying vec2 vUv;
void main() {
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}
`;

  /* ---------- the photo, rebuilt as a layered scene ---------- */
  // Output is stored at half scale (ENC) so that light brighter than white survives in an
  // 8-bit target: only real light sources (sparks, the portal rim) reach the bloom threshold.
  const SCENE_FS = COMMON + `
uniform sampler2D uPhoto;     // rgb colour, a girl alpha
uniform sampler2D uPlate;     // rgb clean plate, a depth
uniform sampler2D uPlateBlur; // rgb blurred plate, a wide halo
uniform sampler2D uAux;       // r wind, g hair, b sky, a tight halo
uniform sampler2D uTiny;      // tiny blurred plate for the surroundings
uniform sampler2D uNoise;     // tileable smooth noise (repeat)
uniform vec2 uRes;
uniform vec4 uRect;
uniform float uTime;
uniform vec2 uCam;
uniform float uPar;
uniform float uLife;          // ambient motion 0..1
uniform float uWind;

uniform vec3 uBalance;
uniform vec3 uGirlBalance;
uniform vec3 uLift;
uniform vec3 uGain;
uniform vec4 uTone;           // x exposure (scene), y exposure (girl), z contrast, w saturation
uniform vec4 uSkyTop;         // rgb, a = replacement amount
uniform vec4 uSkyBottom;      // rgb, a = stars
uniform vec4 uHaze;           // rgb, a = aerial haze
uniform vec4 uMist;           // rgb, a = ground mist
uniform vec4 uRim;            // rgb, a = strength
uniform vec2 uLightDir;       // direction toward the key light (photo space)
uniform vec3 uSpill;          // light cast onto the surroundings by the girl's glow

uniform float uMagic;
uniform float uPortal;
uniform vec2 uPortalC;
uniform vec4 uAura;           // rgb inner colour, a intensity
uniform vec3 uAura2;          // outer colour
uniform vec4 uShock;          // xy centre, z progress, w strength
uniform float uDof;
uniform float uGlints;
uniform float uRaySky;        // how much the sky feeds the light shafts

const vec2 PORTAL_R = vec2(0.28, 0.37);

vec3 grade(vec3 c, float exposure, vec3 balance) {
  c *= exposure * balance;
  float l = luma(c);
  c = max(mix(vec3(l), c, uTone.w), 0.0);
  c = max((c - 0.45) * uTone.z + 0.45, 0.0);
  float l2 = luma(c);
  c += uLift * (1.0 - smoothstep(0.0, 0.55, l2));
  c *= mix(vec3(1.0), uGain, smoothstep(0.2, 0.95, l2));
  return c;
}

vec2 mirrorUv(vec2 p) {
  return clamp(1.0 - abs(1.0 - abs(p)), 0.0, 1.0);
}

vec2 rotate(vec2 v, float a) {
  float c = cos(a), s = sin(a);
  return vec2(v.x * c - v.y * s, v.x * s + v.y * c);
}

void main() {
  vec2 frag = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 p = (frag - uRect.xy) / uRect.zw;
  float t = uTime;

  /* --- background: depth-aware parallax (fixed-point search) --- */
  vec2 cam = uCam * uPar;
  vec2 q = p;
  q = p + cam * (texture2D(uPlate, q).a - PIVOT);
  q = p + cam * (texture2D(uPlate, q).a - PIVOT);
  q = p + cam * (texture2D(uPlate, q).a - PIVOT);

  /* --- wind in the foliage; a slow vortex while the magic is awake --- */
  float w = texture2D(uAux, q).r * uLife;
  vec4 gust = texture2D(uNoise, q * 0.45 + vec2(t * 0.011, t * 0.004));
  vec4 flut = texture2D(uNoise, q * 2.6 + vec2(t * 0.047, -t * 0.031));
  float surge = 0.55 + 0.45 * sin(t * 0.55 + q.x * 3.0 + gust.z * 4.0);
  vec2 wind = (gust.xy - 0.5) * 0.009 * surge + (flut.xy - 0.5) * 0.004;
  wind.x += sin(t * 0.8 + q.y * 2.0) * 0.0016 * (1.0 - q.y);
  vec2 dc = q - uPortalC;
  float rc = length(dc * vec2(1.0, 0.78));
  vec2 tang = vec2(-dc.y, dc.x) / max(rc, 0.06);
  wind += tang * uMagic * 0.005 * (0.6 + 0.4 * sin(t * 1.7 - rc * 14.0)) * smoothstep(0.85, 0.2, rc);
  q += wind * w * uWind;

  /* --- shockwave: a ring of refraction through the background --- */
  float shockRing = 0.0;
  if (uShock.w > 0.001) {
    vec2 sd = q - uShock.xy;
    float sr = length(sd);
    float wave = exp(-pow((sr - uShock.z * 1.35) * 18.0, 2.0)) * uShock.w;
    q -= sd / max(sr, 1e-4) * wave * 0.02;
    shockRing = wave;
  }

  vec4 plate = texture2D(uPlate, q);
  vec4 plateSoft = texture2D(uPlateBlur, q);
  vec4 aux = texture2D(uAux, q);
  float depth = plate.a;
  vec3 sharp = plate.rgb;
  float dof = clamp(abs(depth - GIRL_DEPTH) * 3.0, 0.0, 1.0) * uDof;
  vec3 bg = mix(sharp, plateSoft.rgb, dof);

  /* --- sky: repainted for sunset and night (with stars) --- */
  float sky = aux.b;
  vec3 skyCol = mix(uSkyTop.rgb, uSkyBottom.rgb, smoothstep(-0.05, 0.5, q.y));
  if (uSkyBottom.a > 0.001) {
    vec2 sq = q * 230.0;
    vec2 cell = floor(sq);
    float h = hash12(cell);
    vec2 f = fract(sq) - 0.5 - (vec2(hash12(cell + 7.1), hash12(cell + 3.7)) - 0.5) * 0.6;
    float tw = 0.55 + 0.45 * sin(t * (1.3 + h * 3.0) + h * 61.0);
    skyCol += step(0.93, h) * exp(-dot(f, f) * 38.0) * tw * uSkyBottom.a * (0.5 + 1.5 * fract(h * 17.0));
  }
  float skyAmt = sky * uSkyTop.a;
  bg = mix(bg, skyCol * (0.8 + 0.3 * luma(sharp)), skyAmt);

  vec3 col = grade(bg, uTone.x, uBalance);
  col = mix(col, uHaze.rgb, uHaze.a * (1.0 - depth) * (1.0 - 0.6 * skyAmt));

  /* --- enchanted background: glinting leaves and the girl's light on her surroundings --- */
  if (uGlints > 0.001) {
    vec2 gq = q * 150.0;
    vec2 cell = floor(gq);
    float h = hash12(cell);
    vec2 f = fract(gq) - 0.5;
    float tw = 0.5 + 0.5 * sin(t * (1.2 + h * 2.5) + h * 40.0);
    col += step(0.955, h) * exp(-dot(f, f) * 30.0) * tw * tw * aux.r * uGlints * mix(uAura.rgb, uAura2, h) * 1.4;
  }
  col += uSpill * plateSoft.a * (1.0 - skyAmt * 0.5);

  /* --- the portal: an opening into an enchanted version of the same forest --- */
  float portalGlow = 0.0;
  float open = uPortal;
  if (open > 0.001) {
    vec2 pd = (q - uPortalC) / PORTAL_R;
    float pr = length(pd);
    vec2 pdir = pd / max(pr, 1e-4);
    float grow = smoothstep(0.0, 0.3, open);
    float breathe = texture2D(uNoise, pdir * 0.12 + vec2(t * 0.008, t * 0.006)).r;
    float e = pr + (breathe - 0.5) * 0.1 * grow - open;            // < 0 inside the opening
    float inside = 1.0 - smoothstep(-0.14, 0.015, e);
    float deep = clamp(-e / max(open, 0.2), 0.0, 1.0);             // 0 at the rim, 1 at the centre

    // the forest behind, turned and drawn inward, lit from within
    vec2 pv = rotate(q - uPortalC, deep * deep * 1.8 + t * 0.06) * (1.0 - 0.35 * deep);
    vec3 world = texture2D(uPlateBlur, uPortalC + pv).rgb;
    float wl = luma(world);
    vec3 tint = mix(uAura2, uAura.rgb, smoothstep(0.15, 0.75, wl));
    vec3 inner = world * 0.5 + tint * (0.1 + 0.6 * wl);
    float veil = texture2D(uNoise, rotate(pd, -t * 0.05) * 0.4 + vec2(t * 0.012, 0.0)).r;
    float veil2 = texture2D(uNoise, rotate(pd, t * 0.08) * 0.8 - vec2(0.0, t * 0.02)).b;
    inner += tint * smoothstep(0.45, 0.95, veil * 0.65 + veil2 * 0.5) * 0.35 * deep;
    float core = exp(-pr * pr * 3.5);
    inner += uAura.rgb * core * 0.5;
    col = mix(col, inner, inside * grow);

    // the rim: a fine thread of light, brighter arcs of energy flowing around it
    float arcs = texture2D(uNoise, rotate(pdir, t * 0.35) * 0.3).a;
    float arcs2 = texture2D(uNoise, rotate(pdir, -t * 0.22) * 0.55 + 0.37).g;
    float energy = smoothstep(0.42, 0.85, arcs * 0.6 + arcs2 * 0.5);
    float thread = exp(-pow(e * 110.0, 2.0));
    float band = exp(-pow(e * 30.0, 2.0));
    vec3 rimCol = mix(uAura.rgb, vec3(1.0), 0.2);
    col += rimCol * (thread * (0.35 + 1.5 * energy) + band * (0.06 + 0.32 * energy)) * grow;
    col += uAura2 * exp(-pow(e * 7.0, 2.0)) * 0.1 * grow;
    portalGlow = (inside * (0.2 + 0.8 * core) + thread * energy * 0.6) * grow;
  }
  col += mix(uAura.rgb, vec3(1.0), 0.5) * shockRing * 0.45;

  /* --- ground mist --- */
  float mn = texture2D(uNoise, p * vec2(0.55, 1.2) + vec2(t * 0.009, 0.0)).r * 0.6
           + texture2D(uNoise, p * vec2(1.3, 2.6) - vec2(t * 0.016, 0.0)).g * 0.4;
  float mist = smoothstep(0.5, 1.02, p.y) * smoothstep(0.28, 0.75, mn) * uMist.a;
  col = mix(col, uMist.rgb, mist);

  /* --- the girl: steady, only her loose hair moves; the face is never displaced --- */
  vec2 g = p + cam * (GIRL_DEPTH - PIVOT);
  float hw = texture2D(uAux, g).g * uLife;
  vec4 hn = texture2D(uNoise, vec2(g.y * 1.7 + t * 0.09, g.x * 0.5 + t * 0.05));
  vec2 hoff = vec2((hn.x - 0.5) * 0.011 + sin(t * 1.15 + g.y * 9.0) * 0.0024,
                   (hn.y - 0.5) * 0.0035) * hw * (1.0 + 1.6 * uMagic);
  vec2 gs = g - hoff;
  vec4 girl = texture2D(uPhoto, gs);
  float gEdge = min(min(gs.x, 1.0 - gs.x), min(gs.y, 1.0 - gs.y));
  float a = girl.a * smoothstep(-0.002, 0.012, gEdge);

  vec3 fc = grade(girl.rgb, uTone.y, uGirlBalance);
  float tight = texture2D(uAux, gs).a;
  float ahead = texture2D(uAux, gs + uLightDir * 0.016).a;
  fc += uRim.rgb * uRim.a * smoothstep(0.1, 0.95, 1.0 - ahead) * (0.35 + 0.65 * luma(girl.rgb));
  // backlight from the portal wrapping around her edges
  fc += uAura.rgb * smoothstep(0.97, 0.6, tight) * uMagic * uAura.a * 0.16 * (0.3 + 0.7 * open);
  fc = mix(fc, uMist.rgb, mist * 0.45);
  col = mix(col, fc, a);

  /* --- aura: soft light licking up around the silhouette --- */
  if (uMagic > 0.001) {
    float haloG = texture2D(uPlateBlur, g).a;
    float f1 = texture2D(uNoise, g * vec2(2.4, 1.2) + vec2(0.0, t * 0.1)).r;
    float f2 = texture2D(uNoise, g * vec2(5.0, 2.5) + vec2(t * 0.03, t * 0.24)).g;
    float energy = smoothstep(0.4, 0.9, f1 * 0.6 + f2 * 0.55);
    float near = smoothstep(0.03, 0.75, tight) * (1.0 - a);
    float glow = haloG * 0.14 + near * (0.08 + 0.6 * energy);
    col += mix(uAura2, uAura.rgb, near) * glow * uMagic * uAura.a * 0.45;
  }

  /* --- beyond the photo: its surroundings, out of focus and falling into shadow --- */
  float edge = min(min(p.x, 1.0 - p.x), min(p.y, 1.0 - p.y));
  float inPhoto = smoothstep(0.0, 0.085, edge);
  float outside = max(0.0, -edge);
  vec2 mp = mirrorUv(p);
  vec3 ext = mix(texture2D(uPlateBlur, mp).rgb, texture2D(uTiny, mp).rgb, smoothstep(0.0, 0.14, outside + 0.02));
  ext = grade(ext, uTone.x, uBalance);
  ext = mix(vec3(luma(ext)), ext, 0.75) * 0.72 * exp(-outside * 3.2);
  ext = mix(ext, uMist.rgb * 0.5, uMist.a * 0.5 * smoothstep(0.55, 1.2, p.y));
  col = mix(ext, col, inPhoto);

  /* alpha: what the light shafts are made of (bright sky, the portal), minus the girl */
  float skyLight = sky * smoothstep(0.45, 0.9, luma(sharp)) * uRaySky;
  float occ = clamp(skyLight + portalGlow * uMagic, 0.0, 1.0) * (1.0 - a) * inPhoto;
  gl_FragColor = vec4(col * ENC, occ);
}
`;

  /* ---------- particles: camera-facing quads ---------- */
  const PARTICLE_VS = 'precision highp float;\n' + COMMON + `
attribute vec4 aPos;     // x, y (photo uv), z (depth, 0 far .. 1 near), size (photo px)
attribute vec4 aColor;   // rgb, alpha
attribute vec4 aShape;   // type, rotation, flip, seed
attribute vec2 aCorner;  // -1..1
uniform vec2 uRes;
uniform vec4 uRect;
uniform vec2 uCam;
uniform float uPar;
uniform float uFocus;
uniform float uDof;
uniform float uMaxSize;
varying vec4 vColor;
varying vec2 vLocal;
varying float vType;
varying float vSharp;
varying float vBehind;
varying float vFlip;
void main() {
  float d = aPos.z;
  vec2 p = aPos.xy - uCam * uPar * (d - PIVOT) * 1.6;
  vec2 center = uRect.xy + p * uRect.zw;
  float scale = uRect.z / 640.0;
  float size = aPos.w * scale * (0.55 + 0.9 * d);
  float coc = abs(d - uFocus) * uDof * scale;
  float total = size + coc;
  float drawn = min(total, uMaxSize * scale);
  float c = cos(aShape.y), s = sin(aShape.y);
  vec2 k = aCorner * vec2(aShape.x > 1.5 ? max(abs(aShape.z), 0.14) : 1.0, 1.0);
  vec2 corner = vec2(k.x * c - k.y * s, k.x * s + k.y * c);
  vec2 pos = center + corner * drawn * 0.5;
  gl_Position = vec4(pos.x / uRes.x * 2.0 - 1.0, 1.0 - pos.y / uRes.y * 2.0, 0.0, 1.0);
  vLocal = aCorner;
  vType = aShape.x;
  vFlip = aShape.z;
  vSharp = size / total;
  vColor = aColor;
  vColor.a *= mix(vSharp, 1.0, 0.3) * (total / drawn > 1.0 ? drawn / total : 1.0);
  if (aShape.x > 1.5) vColor.a *= smoothstep(0.02, 0.3, abs(aShape.z)) * 0.8 + 0.2;
  vBehind = smoothstep(GIRL_DEPTH - 0.012, GIRL_DEPTH - 0.05, d);
}
`;

  const PARTICLE_FS = COMMON + `
uniform sampler2D uPhoto;
uniform vec2 uRes;
uniform vec4 uRect;
uniform vec2 uCam;
uniform float uPar;
uniform vec3 uLeafGlow;
varying vec4 vColor;
varying vec2 vLocal;
varying float vType;
varying float vSharp;
varying float vBehind;
varying float vFlip;
void main() {
  vec2 c = vLocal;
  float r2 = dot(c, c);
  vec4 o;
  if (vType < 0.5) {                    // soft light: motes, fireflies, bokeh
    if (r2 > 1.0) discard;
    float r = sqrt(r2);
    float focused = exp(-r2 * 12.0) * 1.3 + exp(-r2 * 3.5) * 0.3;
    float bokeh = smoothstep(1.0, 0.72, r) * (0.8 + 0.2 * smoothstep(0.4, 0.95, r)) * 0.5;
    o = vec4(vColor.rgb * vColor.a * mix(bokeh, focused, vSharp), 0.0);
  } else if (vType < 1.5) {             // spark: a star-shaped glint
    if (r2 > 1.0) discard;
    float core = exp(-r2 * 16.0);
    float rays = exp(-abs(c.x) * 20.0) * exp(-abs(c.y) * 2.6) + exp(-abs(c.y) * 20.0) * exp(-abs(c.x) * 2.6);
    float i = core * 1.2 + rays * 0.7 * vSharp + exp(-r2 * 3.5) * 0.22;
    o = vec4(vColor.rgb * vColor.a * i, 0.0);
  } else {                              // leaf
    float y = c.y;
    float halfW = 0.46 * sqrt(max(0.0, 1.0 - y * y)) * (1.0 - 0.28 * y);
    float cov = smoothstep(0.08, -0.03, abs(c.x) - halfW) * smoothstep(1.0, 0.9, abs(y));
    float stem = smoothstep(0.05, 0.0, abs(c.x)) * step(0.85, y) * step(y, 1.0);
    cov = max(cov, stem);
    if (cov < 0.01) discard;
    float vein = smoothstep(0.045, 0.0, abs(c.x)) * 0.3 + smoothstep(0.03, 0.0, abs(abs(c.x) * 1.6 - (y + 0.9) * 0.18 - 0.02)) * 0.12;
    float side = vFlip < 0.0 ? 0.72 : 1.0;
    vec3 col = vColor.rgb * side * (0.82 + 0.3 * (1.0 - y) * 0.5) * (1.0 - vein);
    float rim = smoothstep(-0.1, 0.02, abs(c.x) - halfW);
    col += vColor.rgb * rim * 0.35 + uLeafGlow * (rim * 0.9 + 0.12);
    o = vec4(col * cov * vColor.a, cov * vColor.a);
  }
  vec2 frag = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 g = (frag - uRect.xy) / uRect.zw + uCam * uPar * (GIRL_DEPTH - PIVOT);
  float ga = texture2D(uPhoto, clamp(g, 0.0, 1.0)).a;
  o *= 1.0 - ga * vBehind;
  gl_FragColor = vec4(o.rgb * ENC, o.a);
}
`;

  /* ---------- light shafts: radial blur of the occluder mask ---------- */
  const RAYS_FS = COMMON + `
uniform sampler2D uMask;      // alpha = light sources (quarter resolution, pre-filtered)
uniform sampler2D uPhoto;     // girl alpha: the shafts pass mostly behind her
uniform vec2 uLight;          // light position, uv of the target
uniform float uDensity;
uniform float uDecay;
uniform vec4 uRect;           // photo rectangle in target uv (origin xy, size zw), y down
uniform vec2 uGirlShift;
varying vec2 vUv;
void main() {
  vec2 uv = vUv;
  vec2 delta = (uv - uLight) * uDensity / 48.0;
  uv -= delta * (hash12(gl_FragCoord.xy) * 0.5);
  float acc = 0.0, decay = 1.0;
  for (int i = 0; i < 48; i++) {
    uv -= delta;
    vec2 inb = step(vec2(0.0), uv) * step(uv, vec2(1.0));
    acc += texture2D(uMask, uv).a * decay * inb.x * inb.y;
    decay *= uDecay;
  }
  vec2 g = (vec2(vUv.x, 1.0 - vUv.y) - uRect.xy) / uRect.zw + uGirlShift;
  float girl = texture2D(uPhoto, clamp(g, 0.0, 1.0)).a;
  gl_FragColor = vec4(vec3(acc / 20.0 * (1.0 - 0.72 * girl)), 1.0);
}
`;

  /* ---------- bloom ---------- */
  const BRIGHT_FS = COMMON + `
uniform sampler2D uTex;
uniform vec2 uTexel;
uniform float uThreshold;
varying vec2 vUv;
void main() {
  vec4 sum = texture2D(uTex, vUv + uTexel * vec2(-1.0, -1.0)) + texture2D(uTex, vUv + uTexel * vec2(1.0, -1.0))
           + texture2D(uTex, vUv + uTexel * vec2(-1.0, 1.0)) + texture2D(uTex, vUv + uTexel * vec2(1.0, 1.0));
  vec3 s = sum.rgb * 0.25 / ENC;
  float br = max(s.r, max(s.g, s.b));
  float knee = 0.2;
  float soft = clamp(br - uThreshold + knee, 0.0, 2.0 * knee);
  soft = soft * soft / (4.0 * knee + 1e-4);
  float k = max(soft, br - uThreshold) / max(br, 1e-4);
  gl_FragColor = vec4(s * k, sum.a * 0.25);   // alpha: averaged light sources for the shafts
}
`;

  const DOWN_FS = COMMON + `
uniform sampler2D uTex;
uniform vec2 uTexel;
varying vec2 vUv;
void main() {
  vec3 s = texture2D(uTex, vUv + uTexel * vec2(-1.0, -1.0)).rgb
         + texture2D(uTex, vUv + uTexel * vec2(1.0, -1.0)).rgb
         + texture2D(uTex, vUv + uTexel * vec2(-1.0, 1.0)).rgb
         + texture2D(uTex, vUv + uTexel * vec2(1.0, 1.0)).rgb;
  gl_FragColor = vec4(s * 0.25, 1.0);
}
`;

  const BLUR_FS = COMMON + `
uniform sampler2D uTex;
uniform vec2 uDir;
varying vec2 vUv;
void main() {
  vec3 c = texture2D(uTex, vUv).rgb * 0.2270270270;
  c += texture2D(uTex, vUv + uDir * 1.3846153846).rgb * 0.3162162162;
  c += texture2D(uTex, vUv - uDir * 1.3846153846).rgb * 0.3162162162;
  c += texture2D(uTex, vUv + uDir * 3.2307692308).rgb * 0.0702702703;
  c += texture2D(uTex, vUv - uDir * 3.2307692308).rgb * 0.0702702703;
  gl_FragColor = vec4(c, 1.0);
}
`;

  /* ---------- final grade: bloom, shafts, lens, film ---------- */
  const FINAL_FS = COMMON + `
uniform sampler2D uScene;
uniform sampler2D uBloom1;
uniform sampler2D uBloom2;
uniform sampler2D uRays;
uniform vec2 uRes;
uniform vec2 uAspect;
uniform vec3 uRayColor;
uniform vec2 uBloomK;
uniform vec4 uSun;          // rgb glow colour, a strength
uniform vec2 uSunUv;
uniform float uVignette;
uniform float uGrain;
uniform float uFade;
uniform float uFlash;
uniform float uAberration;
uniform float uTonemap;
uniform float uTime;
varying vec2 vUv;
vec3 shoulder(vec3 c) {
  vec3 a = vec3(0.82);
  return mix(c, a + (1.0 - a) * (1.0 - exp(-(c - a) / (1.0 - a))), step(a, c));
}
void main() {
  vec2 uv = vUv;
  vec2 dc = uv - 0.5;
  float r2 = dot(dc * uAspect, dc * uAspect);
  float ca = uAberration * r2;
  vec3 col = vec3(texture2D(uScene, uv - dc * ca).r, texture2D(uScene, uv).g, texture2D(uScene, uv + dc * ca).b) / ENC;
  col += texture2D(uBloom1, uv).rgb * uBloomK.x + texture2D(uBloom2, uv).rgb * uBloomK.y;
  col += texture2D(uRays, uv).r * uRayColor;
  float sd = length((uv - uSunUv) * uAspect);
  col += uSun.rgb * uSun.a * (exp(-sd * 3.2) * 0.55 + exp(-sd * 12.0) * 0.8);
  col += uFlash * vec3(1.0, 0.95, 0.85);
  col = mix(col, shoulder(col), uTonemap);
  float vig = smoothstep(1.0, 0.22, length(dc) * 1.45);
  col *= mix(1.0, vig, uVignette);
  col += (hash12(uv * uRes + fract(uTime * 7.13) * 91.7) - 0.5) * uGrain;
  gl_FragColor = vec4(clamp(col, 0.0, 1.0) * uFade, 1.0);
}
`;

  return { FULLSCREEN_VS, SCENE_FS, PARTICLE_VS, PARTICLE_FS, RAYS_FS, BRIGHT_FS, DOWN_FS, BLUR_FS, FINAL_FS };
})();
</script>
<script>
/* =========================================================================
   Particles, simulated on the CPU in photo space (x, y in photo uv,
   z = depth 0 far .. 1 near) and drawn as camera-facing quads sorted back
   to front. Anything behind the girl's depth is hidden by her silhouette.
   ========================================================================= */
const Particles = (() => {
  'use strict';

  const DRAW_GLOW = 0, DRAW_SPARK = 1, DRAW_LEAF = 2;
  const MOTE = 0, FIREFLY = 1, ORB = 2, SPARK = 3, VORTEX_LEAF = 4, FALLING_LEAF = 5, RIM_LEAF = 6;
  const GIRL_DEPTH = 0.62;
  const FACE = [0.515, 0.235, 0.075, 0.1]; // centre and radii of her face, photo uv: kept clear
  const FLOATS = 14; // per vertex: pos(4) colour(4) shape(4) corner(2)
  const CORNERS = [-1, -1, 1, -1, 1, 1, -1, 1];
  const LEAF_COLOURS = [
    [0.36, 0.52, 0.17], [0.47, 0.6, 0.2], [0.3, 0.45, 0.16], [0.7, 0.62, 0.22], [0.78, 0.46, 0.16],
  ];
  const FIELDS = ['x', 'y', 'z', 'vx', 'vy', 'vz', 'size', 'r', 'g', 'b', 'base', 'alpha', 'age', 'ttl',
    'rot', 'vrot', 'flip', 'vflip', 'seed', 'p0', 'p1', 'p2', 'p3'];

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
  const smooth = (a, b, v) => { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };
  const pick = (list) => list[(Math.random() * list.length) | 0];

  class System {
    constructor(max = 1600) {
      this.max = max;
      for (const f of FIELDS) this[f] = new Float32Array(max);
      this.kind = new Uint8Array(max);
      this.draw = new Uint8Array(max);
      this.n = 0;
      this.verts = new Float32Array(max * 4 * FLOATS);
      this.order = new Uint16Array(max);
      this.acc = { ribbon: 0, wisp: 0, inflow: 0, leaf: 0 };
      this.ribbonColour = [0, 0, 0];

      for (let k = 0; k < 170; k++) this.spawnMote();
      for (let k = 0; k < 90; k++) this.spawnFirefly();
      for (let k = 0; k < 14; k++) this.spawnOrb();
      for (let k = 0; k < 44; k++) this.spawnVortexLeaf();
      for (let k = 0; k < 34; k++) this.spawnRimLeaf();
    }

    add(kind, draw) {
      if (this.n >= this.max) return -1;
      const i = this.n++;
      for (const f of FIELDS) this[f][i] = 0;
      this.kind[i] = kind;
      this.draw[i] = draw;
      this.seed[i] = Math.random();
      return i;
    }

    remove(i) {
      const last = --this.n;
      if (i === last) return;
      for (const f of FIELDS) this[f][i] = this[f][last];
      this.kind[i] = this.kind[last];
      this.draw[i] = this.draw[last];
    }

    /* ---------- spawners ---------- */

    spawnMote() {
      const i = this.add(MOTE, DRAW_GLOW);
      if (i < 0) return;
      this.x[i] = rand(-0.15, 1.15); this.y[i] = rand(-0.1, 1.05); this.z[i] = rand(0.3, 0.97);
      this.size[i] = rand(2.2, 4.6);
      this.base[i] = rand(0.35, 0.9);
      this.p0[i] = Math.random();              // rank: which motes show at a given density
    }

    spawnFirefly() {
      const i = this.add(FIREFLY, DRAW_GLOW);
      if (i < 0) return;
      this.x[i] = rand(-0.05, 1.05); this.y[i] = rand(0.3, 0.98);
      this.p3[i] = rand(0.45, 0.85);           // resting depth
      this.z[i] = this.p3[i];
      this.p0[i] = Math.random();              // rank
      this.p1[i] = rand(5, 9.5);               // size
      this.p2[i] = rand(0.6, 1.4);             // speed
    }

    spawnOrb() {
      const i = this.add(ORB, DRAW_GLOW);
      if (i < 0) return;
      const near = Math.random() < 0.6;
      const side = Math.random() < 0.5 ? rand(-0.12, 0.16) : rand(0.84, 1.12);
      this.x[i] = near ? side : rand(0, 1);
      this.y[i] = rand(0.0, 0.95);
      this.z[i] = near ? rand(0.9, 1.0) : rand(0.05, 0.2);
      this.size[i] = near ? rand(22, 46) : rand(10, 18);
      this.base[i] = near ? rand(0.06, 0.14) : rand(0.1, 0.22);
      this.p0[i] = Math.random();
    }

    // Leaves of the vortex around the girl: they rise from the ground while the magic is awake.
    spawnVortexLeaf() {
      const i = this.add(VORTEX_LEAF, DRAW_LEAF);
      if (i < 0) return;
      this.resetVortexLeaf(i, rand(-1.2, 0));
    }

    // Leaves woven along the portal's rim, some in front of it and some behind.
    spawnRimLeaf() {
      const i = this.add(RIM_LEAF, DRAW_LEAF);
      if (i < 0) return;
      this.p0[i] = rand(0, Math.PI * 2);
      this.p1[i] = rand(0.7, 1.3) * (Math.random() < 0.8 ? 1 : -0.6);
      this.p3[i] = rand(-0.05, 0.08);
      this.size[i] = rand(8, 13);
      this.vrot[i] = rand(-2, 2);
      this.vflip[i] = rand(1.4, 3.8);
      const c = pick(LEAF_COLOURS);
      this.r[i] = c[0]; this.g[i] = c[1]; this.b[i] = c[2];
    }

    resetVortexLeaf(i, height) {
      this.p0[i] = rand(0, Math.PI * 2);                         // orbit angle
      this.p1[i] = rand(0.9, 1.7) * (Math.random() < 0.85 ? 1 : 0.7); // angular speed
      this.p2[i] = height;                                        // 0 = ground .. 1 = above the head
      this.p3[i] = rand(0.2, 0.3);                                // orbit radius
      this.vz[i] = rand(0.1, 0.19);                               // rise speed
      this.size[i] = rand(9, 15);
      this.vrot[i] = rand(-2.2, 2.2);
      this.vflip[i] = rand(1.6, 4.2);
      const c = pick(LEAF_COLOURS);
      this.r[i] = c[0]; this.g[i] = c[1]; this.b[i] = c[2];
      this.alpha[i] = 0;
    }

    spawnSpark(x, y, z, vx, vy, vz, { ttl = 1, size = 3, colour, base = 1, drag = 1.5, lift = 0.01, draw = DRAW_SPARK } = {}) {
      const i = this.add(SPARK, draw);
      if (i < 0) return -1;
      this.x[i] = x; this.y[i] = y; this.z[i] = z;
      this.vx[i] = vx; this.vy[i] = vy; this.vz[i] = vz;
      this.ttl[i] = ttl; this.size[i] = size; this.base[i] = base;
      this.r[i] = colour[0]; this.g[i] = colour[1]; this.b[i] = colour[2];
      this.p0[i] = drag; this.p1[i] = lift;
      this.rot[i] = rand(0, Math.PI); this.vrot[i] = rand(-1.5, 1.5);
      return i;
    }

    spawnFallingLeaf(x, y, z, vx, vy) {
      const i = this.add(FALLING_LEAF, DRAW_LEAF);
      if (i < 0) return;
      this.x[i] = x; this.y[i] = y; this.z[i] = z;
      this.vx[i] = vx; this.vy[i] = vy;
      this.p0[i] = rand(0.035, 0.07);          // terminal fall speed
      this.size[i] = rand(9, 15);
      this.vrot[i] = rand(-1.8, 1.8);
      this.vflip[i] = rand(1.4, 3.6);
      this.ttl[i] = 40;
      this.base[i] = 1;
      const c = pick(LEAF_COLOURS);
      this.r[i] = c[0]; this.g[i] = c[1]; this.b[i] = c[2];
    }

    /* ---------- events ---------- */

    // The moment the magic ignites: an explosion of light from the heart.
    burst(env) {
      const [hx, hy] = env.heart;
      for (let k = 0; k < 260; k++) {
        const u = rand(-1, 1), th = rand(0, Math.PI * 2), s = Math.sqrt(1 - u * u);
        const speed = rand(0.12, 0.7) * (Math.random() < 0.2 ? 1.4 : 1);
        const hot = Math.random() < 0.3;
        const c = hot ? [1, 0.97, 0.9] : Math.random() < 0.5 ? env.colours.inner : env.colours.outer;
        this.spawnSpark(hx + rand(-0.02, 0.02), hy + rand(-0.03, 0.03), GIRL_DEPTH + 0.01,
          s * Math.cos(th) * speed, s * Math.sin(th) * speed * 0.85, u * speed * 0.18,
          { ttl: rand(1.2, 3.2), size: rand(2, 4.4), colour: c, base: rand(0.6, 1), drag: 1.35, lift: 0.02,
            draw: Math.random() < 0.7 ? DRAW_SPARK : DRAW_GLOW });
      }
      // push the drifting motes and fireflies outward
      for (let i = 0; i < this.n; i++) {
        const k = this.kind[i];
        if (k !== MOTE && k !== FIREFLY) continue;
        const dx = this.x[i] - hx, dy = this.y[i] - hy, d = Math.hypot(dx, dy) + 1e-3;
        const f = 0.45 * Math.exp(-d * 2.5);
        this.vx[i] += (dx / d) * f; this.vy[i] += (dy / d) * f;
      }
      // leaves start low and rise into the vortex
      for (let i = 0; i < this.n; i++) {
        if (this.kind[i] === VORTEX_LEAF) this.resetVortexLeaf(i, rand(-0.9, 0.35));
      }
    }

    // The magic is released: vortex leaves fly off and drift down.
    release() {
      for (let i = this.n - 1; i >= 0; i--) {
        if (this.kind[i] !== VORTEX_LEAF) continue;
        if (this.alpha[i] > 0.05 && Math.random() < 0.35) {
          const out = this.x[i] < 0.52 ? -1 : 1;
          this.spawnFallingLeaf(this.x[i], this.y[i], this.z[i], out * rand(0.05, 0.16), rand(-0.12, -0.02));
        }
        this.resetVortexLeaf(i, rand(-1.2, -0.2));
      }
    }

    // A touch while the magic is awake scatters a handful of light.
    sparkle(x, y, env) {
      const z = GIRL_DEPTH + 0.06;
      this.spawnSpark(x, y, z, 0, 0, 0, { ttl: 0.7, size: 46, colour: env.colours.inner, base: 0.55, drag: 0, lift: 0, draw: DRAW_GLOW });
      for (let k = 0; k < 48; k++) {
        const a = rand(0, Math.PI * 2), sp = rand(0.05, 0.32);
        this.spawnSpark(x, y, z + rand(-0.04, 0.06), Math.cos(a) * sp, Math.sin(a) * sp, rand(-0.05, 0.05),
          { ttl: rand(0.8, 1.8), size: rand(2.6, 6), colour: Math.random() < 0.5 ? env.colours.inner : env.colours.outer,
            base: rand(0.8, 1.3), drag: 2.2, lift: 0.02, draw: Math.random() < 0.6 ? DRAW_SPARK : DRAW_GLOW });
      }
    }

    /* ---------- simulation ---------- */

    update(env) {
      const { t, dt, magic, gather, awake } = env;
      const [hx, hy] = env.heart;
      const dens = env.density;
      const lerp = Math.min(1, dt * 0.9);

      // emitters: energy ribbons orbiting the girl, wisps rising from her outline, inflow while gathering
      if (awake && magic > 0.02) {
        this.acc.ribbon += dt * 110 * magic;
        while (this.acc.ribbon >= 1) {
          this.acc.ribbon -= 1;
          const k = (Math.random() * 3) | 0;
          const tt = t - Math.random() * dt;
          const th = tt * (1.05 + 0.22 * k) * (k === 1 ? -1 : 1) + k * 2.1;
          const r = 0.24 + 0.05 * Math.sin(tt * 0.5 + k * 1.3);
          const y = hy + 0.06 + 0.31 * Math.sin(tt * (0.31 + 0.06 * k) + k * 1.7);
          const c = this.ribbonColour;
          const mix = Math.random();
          for (let j = 0; j < 3; j++) c[j] = env.colours.inner[j] * (1 - mix) + env.colours.outer[j] * mix;
          this.spawnSpark(hx + r * Math.cos(th) + rand(-0.004, 0.004), y + rand(-0.004, 0.004),
            GIRL_DEPTH + r * Math.sin(th) * 0.9, rand(-0.01, 0.01), rand(-0.02, 0.0), 0,
            { ttl: rand(0.55, 1.05), size: rand(2, 3.6), colour: c.slice(), base: rand(0.45, 0.85), drag: 2, lift: 0.01,
              draw: Math.random() < 0.35 ? DRAW_SPARK : DRAW_GLOW });
        }
        this.acc.wisp += dt * 30 * magic;
        while (this.acc.wisp >= 1) {
          this.acc.wisp -= 1;
          const pt = pick(env.outline);
          this.spawnSpark(pt[0] + rand(-0.006, 0.006), pt[1] + rand(-0.006, 0.006), GIRL_DEPTH + rand(-0.03, 0.03),
            rand(-0.01, 0.01), rand(-0.06, -0.02), 0,
            { ttl: rand(1.2, 2.5), size: rand(1.6, 3), colour: env.colours.inner, base: rand(0.35, 0.8),
              drag: 0.6, lift: 0.01, draw: DRAW_GLOW });
        }
      }
      if (gather > 0.01) {
        this.acc.inflow += dt * 150 * gather;
        while (this.acc.inflow >= 1) {
          this.acc.inflow -= 1;
          const a = rand(0, Math.PI * 2), d = rand(0.3, 0.55);
          const x = hx + Math.cos(a) * d, y = hy + Math.sin(a) * d * 0.9;
          const sp = d / 0.75;
          this.spawnSpark(x, y, GIRL_DEPTH + rand(-0.05, 0.1),
            (-Math.cos(a) * 0.85 - Math.sin(a) * 0.5) * sp, (-Math.sin(a) * 0.85 + Math.cos(a) * 0.5) * sp, 0,
            { ttl: 0.75, size: rand(1.6, 3.2), colour: env.colours.inner, base: rand(0.5, 0.9), drag: 0, lift: 0,
              draw: DRAW_GLOW });
        }
      }
      this.acc.leaf += dt * env.leafRate;
      while (this.acc.leaf >= 1) {
        this.acc.leaf -= 1;
        this.spawnFallingLeaf(rand(-0.05, 1.05), -0.08, rand(0.35, 0.96), rand(-0.01, 0.03), rand(0.02, 0.04));
      }

      for (let i = 0; i < this.n;) {
        const s = this.seed[i];
        switch (this.kind[i]) {
          case MOTE: {
            const tx = Math.sin(this.y[i] * 6 + t * 0.21 + s * 6.283) * 0.012 + env.breeze;
            const ty = Math.cos(this.x[i] * 5 + t * 0.17 + s * 3.1) * 0.008 - 0.003;
            this.vx[i] += (tx - this.vx[i]) * lerp;
            this.vy[i] += (ty - this.vy[i]) * lerp;
            if (gather > 0) this.pull(i, hx, hy, gather, dt);
            this.x[i] += this.vx[i] * dt; this.y[i] += this.vy[i] * dt;
            if (this.x[i] < -0.2) this.x[i] += 1.4; else if (this.x[i] > 1.2) this.x[i] -= 1.4;
            if (this.y[i] < -0.15) this.y[i] += 1.25; else if (this.y[i] > 1.1) this.y[i] -= 1.25;
            const vis = smooth(this.p0[i] - 0.1, this.p0[i], dens.motes);
            this.alpha[i] = this.base[i] * vis * (0.6 + 0.4 * Math.sin(t * (0.8 + s * 1.7) + s * 40));
            const c = env.colours.mote;
            this.r[i] = c[0]; this.g[i] = c[1]; this.b[i] = c[2];
            break;
          }
          case FIREFLY: {
            const sp = this.p2[i];
            const ang = s * 6.283 + Math.sin(t * 0.23 * sp + s * 10) * 2.4 + t * 0.12 * (s > 0.5 ? 1 : -1);
            let tx = Math.cos(ang) * 0.028 * sp, ty = Math.sin(ang) * 0.017 * sp;
            if (this.y[i] < 0.28) ty += (0.28 - this.y[i]) * 0.25;
            if (this.y[i] > 0.98) ty -= (this.y[i] - 0.98) * 0.5;
            if (this.x[i] < -0.05) tx += 0.02; else if (this.x[i] > 1.05) tx -= 0.02;
            if (magic > 0.01) {
              const dx = this.x[i] - hx, dy = this.y[i] - hy, d = Math.hypot(dx, dy) + 1e-3;
              tx += (-dy / d) * 0.05 * magic - (dx / d) * (d - 0.34) * 0.16 * magic;
              ty += (dx / d) * 0.05 * magic - (dy / d) * (d - 0.34) * 0.16 * magic;
            }
            this.vx[i] += (tx - this.vx[i]) * Math.min(1, dt * 1.1);
            this.vy[i] += (ty - this.vy[i]) * Math.min(1, dt * 1.1);
            if (gather > 0) this.pull(i, hx, hy, gather, dt);
            this.x[i] += this.vx[i] * dt; this.y[i] += this.vy[i] * dt;
            this.z[i] = this.p3[i] + 0.07 * Math.sin(t * 0.21 + s * 7);
            const pulse = Math.pow(Math.max(0, Math.sin((t * (0.3 + s * 0.35) + s * 13) * 6.283)), 6);
            const vis = smooth(this.p0[i] - 0.1, this.p0[i], dens.fireflies);
            this.alpha[i] = (0.16 + 0.9 * pulse) * vis;
            this.size[i] = this.p1[i] * (0.85 + 0.3 * pulse);
            const c = env.colours.firefly;
            this.r[i] = c[0]; this.g[i] = c[1]; this.b[i] = c[2];
            break;
          }
          case ORB: {
            this.x[i] += Math.sin(t * 0.07 + s * 10) * 0.004 * dt;
            this.y[i] += Math.cos(t * 0.05 + s * 7) * 0.003 * dt - 0.001 * dt;
            if (this.y[i] < -0.1) this.y[i] = 1.0;
            const vis = smooth(this.p0[i] - 0.15, this.p0[i], dens.orbs);
            this.alpha[i] = this.base[i] * vis * (0.7 + 0.3 * Math.sin(t * 0.3 + s * 9));
            const c = env.colours.orb;
            this.r[i] = c[0]; this.g[i] = c[1]; this.b[i] = c[2];
            break;
          }
          case SPARK: {
            this.age[i] += dt;
            const life = this.age[i] / this.ttl[i];
            if (life >= 1) { this.remove(i); continue; }
            const k = Math.exp(-this.p0[i] * dt);
            this.vx[i] *= k; this.vy[i] *= k; this.vz[i] *= k;
            this.vy[i] -= this.p1[i] * dt;
            this.x[i] += this.vx[i] * dt; this.y[i] += this.vy[i] * dt;
            this.z[i] = Math.min(0.9, Math.max(0.3, this.z[i] + this.vz[i] * dt));
            this.rot[i] += this.vrot[i] * dt;
            const fade = smooth(0, 0.1, life) * (1 - smooth(0.5, 1, life));
            this.alpha[i] = this.base[i] * fade * (0.75 + 0.25 * Math.sin(t * 23 + s * 60));
            break;
          }
          case VORTEX_LEAF: {
            this.p0[i] += this.p1[i] * dt * (0.4 + 0.6 * magic);
            this.p2[i] += this.vz[i] * dt * magic;
            if (this.p2[i] > 1.06) this.resetVortexLeaf(i, rand(-0.25, -0.02));
            const h = this.p2[i];
            const r = (this.p3[i] + 0.09 * Math.max(0, h)) * (0.6 + 0.4 * magic);
            this.x[i] = hx + r * Math.cos(this.p0[i]);
            this.z[i] = GIRL_DEPTH + r * Math.sin(this.p0[i]) * 0.9;
            this.y[i] = 1.0 - h * 1.08 + 0.02 * Math.sin(t * 1.3 + s * 9);
            this.rot[i] += this.vrot[i] * dt;
            this.flip[i] = Math.cos(t * this.vflip[i] + s * 20);
            this.alpha[i] = magic * smooth(-0.04, 0.1, h) * (1 - smooth(0.9, 1.05, h));
            break;
          }
          case RIM_LEAF: {
            const open = env.portal;
            this.p0[i] += this.p1[i] * dt * 0.32;
            const th = this.p0[i];
            const wob = 1 + this.p3[i] + 0.04 * Math.sin(t * 0.7 + s * 17);
            this.x[i] = env.portalCentre[0] + env.portalRadius[0] * open * wob * Math.cos(th);
            this.y[i] = env.portalCentre[1] + env.portalRadius[1] * open * wob * Math.sin(th);
            this.z[i] = GIRL_DEPTH - 0.02 + 0.07 * Math.sin(th * 3 + s * 6);
            this.rot[i] += this.vrot[i] * dt;
            this.flip[i] = Math.cos(t * this.vflip[i] + s * 20);
            this.alpha[i] = smooth(0.25, 0.8, open) * magic;
            break;
          }
          case FALLING_LEAF: {
            this.age[i] += dt;
            this.vx[i] += (Math.sin(t * 1.3 + s * 11) * 0.05 + env.breeze * 2 - this.vx[i]) * Math.min(1, dt * 0.6);
            this.vy[i] += (this.p0[i] - this.vy[i]) * Math.min(1, dt * 0.8);
            this.x[i] += this.vx[i] * dt; this.y[i] += this.vy[i] * dt;
            this.rot[i] += this.vrot[i] * dt;
            this.flip[i] = Math.cos(t * this.vflip[i] + s * 20);
            if (this.y[i] > 1.14 || this.x[i] < -0.3 || this.x[i] > 1.3 || this.age[i] > this.ttl[i]) {
              this.remove(i); continue;
            }
            this.alpha[i] = smooth(0, 0.6, this.age[i]);
            break;
          }
        }
        if (this.z[i] > GIRL_DEPTH - 0.02) {
          const fd = Math.hypot((this.x[i] - FACE[0]) / FACE[2], (this.y[i] - FACE[1]) / FACE[3]);
          if (fd < 1.5) this.alpha[i] *= smooth(0.85, 1.5, fd);
        }
        i++;
      }
    }

    // Spiral pull toward the heart while the energy gathers.
    pull(i, hx, hy, gather, dt) {
      const dx = hx - this.x[i], dy = hy - this.y[i], d = Math.hypot(dx, dy) + 0.03;
      const f = gather * dt * 1.8 * Math.exp(-d * 1.5);
      this.vx[i] += (dx / d * 0.9 - dy / d * 0.7) * f;
      this.vy[i] += (dy / d * 0.9 + dx / d * 0.7) * f;
    }

    /* ---------- vertex output ---------- */

    // Writes visible particles, far to near, and returns how many quads were written.
    write(leafLight) {
      const n = this.n, z = this.z, order = this.order.subarray(0, n);
      for (let i = 0; i < n; i++) order[i] = i;
      order.sort((a, b) => z[a] - z[b]);
      const v = this.verts;
      let o = 0, quads = 0;
      for (let k = 0; k < n; k++) {
        const i = order[k];
        const alpha = this.alpha[i];
        if (alpha <= 0.003) continue;
        let r = this.r[i], g = this.g[i], b = this.b[i];
        const draw = this.draw[i];
        if (draw === DRAW_LEAF) { r *= leafLight[0]; g *= leafLight[1]; b *= leafLight[2]; }
        for (let c = 0; c < 4; c++) {
          v[o++] = this.x[i]; v[o++] = this.y[i]; v[o++] = z[i]; v[o++] = this.size[i];
          v[o++] = r; v[o++] = g; v[o++] = b; v[o++] = alpha;
          v[o++] = draw; v[o++] = this.rot[i]; v[o++] = this.flip[i] || 1; v[o++] = this.seed[i];
          v[o++] = CORNERS[c * 2]; v[o++] = CORNERS[c * 2 + 1];
        }
        quads++;
      }
      return quads;
    }
  }

  return { System, FLOATS, DRAW_LEAF };
})();

<script>
/* =========================================================================
   Sound: synthesised with the Web Audio API, no audio files. Wind and
   leaves, a slow chord that follows the time of day, crickets at night,
   chimes when the magic wakes. Silent until the viewer turns it on.
   ========================================================================= */
class ForestSound {
  constructor() {
    this.enabled = false;
    this.ctx = null;
    this.look = 'day';
    this.lastUpdate = 0;
    this.cricketTimer = 0;
  }

  static get CHORDS() {
    return {
      day: [146.83, 220.0, 293.66, 369.99],     // D3 A3 D4 F#4
      dusk: [116.54, 174.61, 233.08, 293.66],   // Bb2 F3 Bb3 D4
      night: [146.83, 220.0, 329.63, 349.23],   // D3 A3 E4 F4
    };
  }

  enable(on) {
    this.enabled = on;
    if (on && !this.ctx && !this.init()) { this.enabled = false; return; }
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    if (on) this.ctx.resume();
    this.master.gain.cancelScheduledValues(now);
    this.master.gain.setTargetAtTime(on ? 0.85 : 0, now, on ? 0.6 : 0.25);
    clearTimeout(this.suspendTimer);
    if (!on) this.suspendTimer = setTimeout(() => { if (!this.enabled) this.ctx.suspend(); }, 1600);
    if (on) this.scheduleCrickets();
  }

  // Hidden tab: stay quiet without forgetting the viewer's choice.
  pause(hidden) {
    if (!this.ctx || !this.enabled) return;
    if (hidden) this.ctx.suspend(); else this.ctx.resume();
  }

  init() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    const ctx = (this.ctx = new AC());
    this.master = ctx.createGain();
    this.master.gain.value = 0;
    const limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -14;
    limiter.ratio.value = 6;
    this.master.connect(limiter).connect(ctx.destination);

    this.reverb = ctx.createConvolver();
    this.reverb.buffer = this.impulse(4.2, 2.4);
    const wet = ctx.createGain();
    wet.gain.value = 0.55;
    this.reverb.connect(wet).connect(this.master);
    this.bus = (node, dry = 1, send = 0.5) => {
      const d = ctx.createGain(); d.gain.value = dry;
      const s = ctx.createGain(); s.gain.value = send;
      node.connect(d).connect(this.master);
      node.connect(s).connect(this.reverb);
    };

    this.noise = this.noiseBuffer(4);

    // wind: slowly wandering band of noise
    this.wind = this.loopNoise();
    const windBand = ctx.createBiquadFilter();
    windBand.type = 'bandpass'; windBand.frequency.value = 420; windBand.Q.value = 0.7;
    this.windGain = ctx.createGain(); this.windGain.gain.value = 0.05;
    this.wind.connect(windBand).connect(this.windGain);
    this.lfo(0.05, 180, windBand.frequency);
    this.lfo(0.11, 0.025, this.windGain.gain);
    this.bus(this.windGain, 1, 0.3);

    // leaves: bright rustle in gusts
    this.leaves = this.loopNoise();
    const leafHp = ctx.createBiquadFilter();
    leafHp.type = 'highpass'; leafHp.frequency.value = 2600;
    this.leafGain = ctx.createGain(); this.leafGain.gain.value = 0.012;
    this.leaves.connect(leafHp).connect(this.leafGain);
    this.lfo(0.17, 0.008, this.leafGain.gain);
    this.bus(this.leafGain, 1, 0.2);

    // pad: a soft chord, detuned pairs through a low-pass
    const padFilter = ctx.createBiquadFilter();
    padFilter.type = 'lowpass'; padFilter.frequency.value = 900; padFilter.Q.value = 0.4;
    this.padFilter = padFilter;
    this.padGain = ctx.createGain(); this.padGain.gain.value = 0.0;
    padFilter.connect(this.padGain);
    this.bus(this.padGain, 0.7, 0.9);
    this.voices = ForestSound.CHORDS[this.look].map((f, i) => {
      const pair = [-4, 4].map((cents) => {
        const o = ctx.createOscillator();
        o.type = i === 0 ? 'sine' : 'triangle';
        o.frequency.value = f;
        o.detune.value = cents;
        const g = ctx.createGain(); g.gain.value = i === 0 ? 0.5 : 0.22;
        o.connect(g).connect(padFilter);
        o.start();
        return o;
      });
      return pair;
    });
    this.lfo(0.07, 260, padFilter.frequency);

    // crickets at night
    this.cricketGain = ctx.createGain(); this.cricketGain.gain.value = 0;
    this.bus(this.cricketGain, 1, 0.35);

    this.wind.start();
    this.leaves.start();
    return true;
  }

  noiseBuffer(seconds) {
    const ctx = this.ctx, len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < len; i++) {                 // pinkish noise (Paul Kellet's filter)
        const w = Math.random() * 2 - 1;
        b0 = 0.99765 * b0 + w * 0.099046;
        b1 = 0.963 * b1 + w * 0.2965164;
        b2 = 0.57 * b2 + w * 1.0526913;
        d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.18;
      }
    }
    return buf;
  }

  loopNoise() {
    const src = this.ctx.createBufferSource();
    src.buffer = this.noise;
    src.loop = true;
    src.loopStart = Math.random();
    return src;
  }

  impulse(seconds, decay) {
    const ctx = this.ctx, len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  lfo(freq, depth, param) {
    const o = this.ctx.createOscillator();
    o.frequency.value = freq * (0.85 + Math.random() * 0.3);
    const g = this.ctx.createGain();
    g.gain.value = depth;
    o.connect(g).connect(param);
    o.start();
  }

  // One bell-like note: a few inharmonic sine partials with a soft attack and long decay.
  chime(freq, when = 0, level = 0.05, length = 3) {
    if (!this.ctx || !this.enabled) return;
    const ctx = this.ctx, t = ctx.currentTime + when;
    const env = ctx.createGain();
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(level, t + 0.012);
    env.gain.exponentialRampToValueAtTime(0.0001, t + length);
    const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    if (pan) pan.pan.value = Math.random() * 1.2 - 0.6;
    for (const [ratio, amp] of [[1, 1], [2.76, 0.32], [5.4, 0.12]]) {
      const o = ctx.createOscillator();
      o.frequency.value = freq * ratio;
      const g = ctx.createGain(); g.gain.value = amp;
      o.connect(g).connect(env);
      o.start(t);
      o.stop(t + length + 0.1);
    }
    if (pan) { env.connect(pan); this.bus(pan, 0.6, 1); } else this.bus(env, 0.6, 1);
  }

  sweep(from, to, seconds, level) {
    if (!this.ctx || !this.enabled) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const src = this.loopNoise();
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 3;
    bp.frequency.setValueAtTime(from, t);
    bp.frequency.exponentialRampToValueAtTime(to, t + seconds);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(level, t + seconds * 0.85);
    g.gain.exponentialRampToValueAtTime(0.0001, t + seconds + 1.2);
    src.connect(bp).connect(g);
    this.bus(g, 0.8, 0.6);
    src.start(t);
    src.stop(t + seconds + 1.4);
  }

  setLook(look) {
    this.look = look;
    if (!this.ctx) return;
    const chord = ForestSound.CHORDS[look], t = this.ctx.currentTime;
    this.voices.forEach((pair, i) => pair.forEach((o) => o.frequency.setTargetAtTime(chord[i], t, 1.2)));
  }

  awaken() {
    this.sweep(260, 3200, 0.9, 0.09);
  }

  burst() {
    if (!this.ctx || !this.enabled) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const boom = ctx.createOscillator();
    boom.frequency.setValueAtTime(92, t);
    boom.frequency.exponentialRampToValueAtTime(38, t + 1.4);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
    boom.connect(g);
    this.bus(g, 1, 0.4);
    boom.start(t);
    boom.stop(t + 2.3);
    const base = ForestSound.CHORDS[this.look][1] * 4;
    [1, 1.25, 1.5, 2, 2.5, 3].forEach((r, i) => this.chime(base * r, 0.05 + i * 0.11 + Math.random() * 0.05, 0.035, 4));
  }

  release() {
    const base = ForestSound.CHORDS[this.look][1] * 4;
    [3, 2.5, 2, 1.5].forEach((r, i) => this.chime(base * r, i * 0.16, 0.025, 3));
  }

  sparkle() {
    const base = ForestSound.CHORDS[this.look][1] * 4;
    const scale = [1, 1.125, 1.25, 1.5, 1.667, 2, 2.25, 2.5];
    for (let k = 0; k < 2; k++) this.chime(base * scale[(Math.random() * scale.length) | 0], k * 0.07, 0.03, 2.4);
  }

  // A few crickets with their own pitch, pace and place in the stereo field.
  scheduleCrickets() {
    if (this.cricketTimer) return;
    const crickets = [0, 1, 2].map(() => ({
      f: 3900 + Math.random() * 900, next: 0, period: 0.7 + Math.random() * 0.6, pan: Math.random() * 1.6 - 0.8,
    }));
    const tick = () => {
      if (!this.enabled) { this.cricketTimer = 0; return; }
      const ctx = this.ctx, now = ctx.currentTime;
      for (const c of crickets) {
        while (c.next < now + 0.3) {
          if (c.next < now) c.next = now + Math.random() * 0.3;
          for (let p = 0; p < 3; p++) this.chirp(c.f, c.next + p * 0.034, c.pan);
          c.next += c.period * (0.85 + Math.random() * 0.3);
        }
      }
      this.cricketTimer = setTimeout(tick, 120);
    };
    tick();
  }

  chirp(freq, t, panValue) {
    const ctx = this.ctx;
    const o = ctx.createOscillator();
    o.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(1, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.026);
    o.connect(g);
    if (ctx.createStereoPanner) {
      const pan = ctx.createStereoPanner();
      pan.pan.value = panValue;
      g.connect(pan).connect(this.cricketGain);
    } else g.connect(this.cricketGain);
    o.start(t);
    o.stop(t + 0.03);
  }

  // Called every frame: follows the time of day and the magic, at most ten times a second.
  update(weights, magic, dt) {
    if (!this.ctx || !this.enabled) return;
    this.lastUpdate += dt;
    if (this.lastUpdate < 0.1) return;
    this.lastUpdate = 0;
    const t = this.ctx.currentTime;
    this.cricketGain.gain.setTargetAtTime(0.018 * weights[2] + 0.004 * weights[1], t, 0.8);
    this.windGain.gain.setTargetAtTime(0.05 * (1 - 0.5 * weights[2]) + 0.03 * magic, t, 0.8);
    this.leafGain.gain.setTargetAtTime(0.012 * (1 - 0.6 * weights[2]) + 0.02 * magic, t, 0.5);
    this.padGain.gain.setTargetAtTime(0.018 + 0.05 * magic, t, 1.2);
    this.padFilter.Q.setTargetAtTime(0.4 + magic * 2, t, 1);
  }
}
window.ForestSound = ForestSound;

      rayColor: [0.25, 0.35, 0.55], raySky: 0.6, sun: [0.6, 0.72, 1.0], sunAmount: 0.18,
      bloom: [0.55, 0.5], threshold: 0.6, vignette: 0.7, grain: 0.035, aberration: 0.01,
      spill: [0.05, 0.08, 0.05], magicExposure: 1.35,
      auraInner: [0.7, 1.0, 0.85], auraOuter: [0.45, 0.55, 1.0], auraAmount: 1.1,
      leafLight: [0.25, 0.32, 0.42], leafGlow: [0.25, 0.5, 0.35],
      motes: 0.4, fireflies: 1, orbs: 0.9, leafRate: 0.05,
      mote: [0.6, 0.8, 1.0], firefly: [0.8, 1.0, 0.42], orb: [0.5, 0.85, 0.7],
    },
  };
  // The untouched photograph: what every look fades in from.
  const NEUTRAL = {
    balance: [1, 1, 1], girlBalance: [1, 1, 1], lift: [0, 0, 0], gain: [1, 1, 1], exposure: 1, girlExposure: 1, contrast: 1,
    saturation: 1, skyAmount: 0, stars: 0, hazeAmount: 0, mistAmount: 0, rimAmount: 0,
    rayColor: [0, 0, 0], sunAmount: 0, bloom: [0, 0], threshold: 1.2, vignette: 0.1, grain: 0.012,
    aberration: 0, spill: [0, 0, 0], motes: 0, fireflies: 0, orbs: 0, leafRate: 0,
  };

  const look = JSON.parse(JSON.stringify(LOOKS.day)); // the blended look, rewritten every frame

  function blendLooks(weights, fx) {
    for (const key in look) {
      const ref = LOOKS.day[key];
      if (Array.isArray(ref)) {
        for (let j = 0; j < ref.length; j++) {
          let v = 0;
          for (let i = 0; i < 3; i++) v += LOOKS[LOOK_NAMES[i]][key][j] * weights[i];
          look[key][j] = key in NEUTRAL ? lerp(NEUTRAL[key][j], v, fx) : v;
        }
      } else {
        let v = 0;
        for (let i = 0; i < 3; i++) v += LOOKS[LOOK_NAMES[i]][key] * weights[i];
        look[key] = key in NEUTRAL ? lerp(NEUTRAL[key], v, fx) : v;
      }
    }
    return look;
  }

  /* ---------- state ---------- */
  const canvas = $('#stage');
  const state = {
    t: 0, last: 0, paused: false, gyro: false,
    shownAt: -1, readyAt: -1, fx: 0, fxTarget: 0,
    weights: [1, 0, 0], weightsFrom: [1, 0, 0], lookIndex: 0, lookChangedAt: -1e9,
    cam: { x: 0, y: 0, tx: 0, ty: 0, lastInput: -1e9, zoom: 1, hover: false },
    magic: { awake: false, since: -1e9, level: 0, portal: 0, portalV: 0, burst: true, quote: false },
    quality: coarsePointer ? 0.85 : 1, perf: { time: 0, frames: 0, good: 0, trial: null, locked: false },
    fixedQuality: params.has('q') ? clamp(+params.get('q'), 0.3, 1) : 0,
  };

  let gl, R, particles, maps = null;
  const sound = window.ForestSound ? new window.ForestSound() : null;

  /* ---------- boot ---------- */
  async function boot() {
    const img = $('#photo-source');
    try { await img.decode(); } catch (e) { /* decode() can reject for data URIs in old engines; onload is enough */ }
    if (!img.complete) await new Promise((r) => { img.onload = r; });

    gl = canvas.getContext('webgl', {
      alpha: false, antialias: false, depth: false, stencil: false,
      premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance',
    });
    if (!gl) return fallback();
    try {
      R = createRenderer(gl, img);
    } catch (err) {
      console.error(err);
      return fallback();
    }
    particles = new Particles.System(1600);
    canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); cancelAnimationFrame(frameId); });
    canvas.addEventListener('webglcontextrestored', () => { R = createRenderer(gl, img); if (maps) R.setMaps(maps); frameId = requestAnimationFrame(loop); });

    bindInput();
    bindUi();
    document.body.classList.add('is-live');
    frameId = requestAnimationFrame(loop);

    const pixels = readPixels(img);
    runAnalysis(pixels).then((m) => {
      maps = m;
      R.setMaps(m);
      state.readyAt = state.t;
      state.fxTarget = 1;
      document.body.classList.add('is-ready');
      $('#magic').disabled = false;
    });
  }

  function readPixels(img) {
    const c = document.createElement('canvas');
    c.width = PHOTO; c.height = PHOTO;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(img, 0, 0, PHOTO, PHOTO);
    return g.getImageData(0, 0, PHOTO, PHOTO).data;
  }

  // Heavy image analysis runs in a worker built from the kernel's own source;
  // if workers are unavailable it runs here instead.
  function runAnalysis(pixels) {
    const local = () => new Promise((resolve) => setTimeout(() => resolve(PhotoAnalysis().analyse(pixels, PHOTO, PHOTO)), 16));
    let url, worker;
    try {
      const src = `const kernel = (${PhotoAnalysis.toString()})();
self.onmessage = (e) => {
  const r = kernel.analyse(e.data.pixels, e.data.size, e.data.size);
  self.postMessage(r, [r.photo.buffer, r.plate.buffer, r.plateBlur.buffer, r.aux.buffer, r.tiny.buffer]);
};`;
      url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
      worker = new Worker(url);
    } catch (e) {
      if (url) URL.revokeObjectURL(url);
      return local();
    }
    return new Promise((resolve) => {
      const done = (result) => { worker.terminate(); URL.revokeObjectURL(url); resolve(result); };
      worker.onmessage = (e) => done(e.data);
      worker.onerror = (e) => { e.preventDefault(); local().then(done); };
      const copy = new Uint8ClampedArray(pixels);
      worker.postMessage({ pixels: copy, size: PHOTO }, [copy.buffer]);
    });
  }

  function fallback() {
    document.body.classList.add('no-webgl');
    const note = $('#fallback-note');
    if (note) note.hidden = false;
  }

  /* ---------- renderer ---------- */
  function createRenderer(gl, img) {
    const S = SHADERS;
    const prog = {
      scene: Engine.program(gl, S.FULLSCREEN_VS, S.SCENE_FS),
      particles: Engine.program(gl, S.PARTICLE_VS, S.PARTICLE_FS),
      rays: Engine.program(gl, S.FULLSCREEN_VS, S.RAYS_FS),
      bright: Engine.program(gl, S.FULLSCREEN_VS, S.BRIGHT_FS),
      down: Engine.program(gl, S.FULLSCREEN_VS, S.DOWN_FS),
      blur: Engine.program(gl, S.FULLSCREEN_VS, S.BLUR_FS),
      final: Engine.program(gl, S.FULLSCREEN_VS, S.FINAL_FS),
    };

    // Before the analysis finishes the scene shows the plain photo: no matte, neutral depth.
    const c = document.createElement('canvas');
    c.width = PHOTO; c.height = PHOTO;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(img, 0, 0, PHOTO, PHOTO);
    const raw = g.getImageData(0, 0, PHOTO, PHOTO).data;
    const plate = new Uint8Array(raw.length), blank = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i += 4) {
      plate[i] = raw[i]; plate[i + 1] = raw[i + 1]; plate[i + 2] = raw[i + 2];
      plate[i + 3] = Math.round(PIVOT * 255);
    }
    const tc = document.createElement('canvas');
    tc.width = 16; tc.height = 16;
    tc.getContext('2d').drawImage(img, 0, 0, 16, 16);
    const tiny = new Uint8Array(tc.getContext('2d').getImageData(0, 0, 16, 16).data);

    const tex = {
      photo: Engine.texture(gl, PHOTO, PHOTO, blank),
      plate: Engine.texture(gl, PHOTO, PHOTO, plate),
      plateBlur: Engine.texture(gl, PHOTO, PHOTO, plate),
      aux: Engine.texture(gl, PHOTO, PHOTO, blank),
      tiny: Engine.texture(gl, 16, 16, tiny),
      noise: Engine.texture(gl, 256, 256, makeNoise(256), { wrap: gl.REPEAT }),
    };

    const T = {
      scene: Engine.target(gl), rays: Engine.target(gl),
      b1: Engine.target(gl), b1t: Engine.target(gl), b2: Engine.target(gl), b2t: Engine.target(gl),
    };

    const tri = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, tri);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

    const MAXP = 1600;
    const pbuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, pbuf);
    gl.bufferData(gl.ARRAY_BUFFER, MAXP * 4 * Particles.FLOATS * 4, gl.DYNAMIC_DRAW);
    const idx = new Uint16Array(MAXP * 6);
    for (let i = 0; i < MAXP; i++) idx.set([i * 4, i * 4 + 1, i * 4 + 2, i * 4, i * 4 + 2, i * 4 + 3], i * 6);
    const ibuf = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibuf);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);

    function fullscreen(p) {
      gl.bindBuffer(gl.ARRAY_BUFFER, tri);
      const loc = p.attribs.aPos;
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    function drawParticles(p, quads, verts) {
      if (!quads) return;
      gl.bindBuffer(gl.ARRAY_BUFFER, pbuf);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, verts.subarray(0, quads * 4 * Particles.FLOATS));
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibuf);
      const stride = Particles.FLOATS * 4;
      const layout = [['aPos', 4, 0], ['aColor', 4, 16], ['aShape', 4, 32], ['aCorner', 2, 48]];
      for (const [name, size, offset] of layout) {
        const loc = p.attribs[name];
        if (loc === undefined || loc < 0) continue;
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, size, gl.FLOAT, false, stride, offset);
      }
      gl.drawElements(gl.TRIANGLES, quads * 6, gl.UNSIGNED_SHORT, 0);
      for (const [name] of layout) {
        const loc = p.attribs[name];
        if (loc !== undefined && loc >= 0) gl.disableVertexAttribArray(loc);
      }
    }

    function setMaps(m) {
      Engine.upload(gl, tex.photo, m.W, m.H, m.photo);
      Engine.upload(gl, tex.plate, m.W, m.H, m.plate);
      Engine.upload(gl, tex.plateBlur, m.W, m.H, m.plateBlur);
      Engine.upload(gl, tex.aux, m.W, m.H, m.aux);
      Engine.upload(gl, tex.tiny, m.tinySize, m.tinySize, m.tiny);
    }

    return { prog, tex, T, fullscreen, drawParticles, setMaps };
  }

  // Tileable smooth value noise, four independent channels.
  function makeNoise(size) {
    const out = new Uint8Array(size * size * 4);
    const octave = (cells, seed) => {
      const lattice = new Float32Array(cells * cells);
      let s = seed;
      for (let i = 0; i < lattice.length; i++) { s = (s * 16807) % 2147483647; lattice[i] = s / 2147483647; }
      const f = new Float32Array(size * size);
      for (let y = 0; y < size; y++) {
        const gy = (y / size) * cells, y0 = Math.floor(gy), ty = gy - y0, sy = ty * ty * (3 - 2 * ty);
        for (let x = 0; x < size; x++) {
          const gx = (x / size) * cells, x0 = Math.floor(gx), tx = gx - x0, sx = tx * tx * (3 - 2 * tx);
          const a = lattice[(y0 % cells) * cells + (x0 % cells)];
          const b = lattice[(y0 % cells) * cells + ((x0 + 1) % cells)];
          const c = lattice[((y0 + 1) % cells) * cells + (x0 % cells)];
          const d = lattice[((y0 + 1) % cells) * cells + ((x0 + 1) % cells)];
          f[y * size + x] = lerp(lerp(a, b, sx), lerp(c, d, sx), sy);
        }
      }
      return f;
    };
    for (let ch = 0; ch < 4; ch++) {
      const o1 = octave(16, 1234 + ch * 977), o2 = octave(32, 4321 + ch * 131), o3 = octave(64, 999 + ch * 71);
      for (let i = 0; i < size * size; i++) {
        const v = (o1[i] * 0.55 + o2[i] * 0.3 + o3[i] * 0.15 - 0.5) * 1.6 + 0.5;
        out[i * 4 + ch] = Math.round(clamp01(v) * 255);
      }
    }
    return out;
  }

  /* ---------- framing ---------- */
  // Photo rectangle in target pixels: the subject always fits, the photo covers as much of
  // the frame as it can, and the camera zooms around the girl's heart.
  function photoRect(W, H, zoom) {
    const [x0, y0, x1, y1] = SUBJECT;
    const fit = Math.min(W / (x1 - x0 + 0.06), H / (y1 - y0 + 0.02));
    let size = Math.max(Math.min(W, H), Math.min(fit, Math.max(W, H)));
    let ox = W / 2 - ((x0 + x1) / 2) * size, oy = H / 2 - ((y0 + y1) / 2) * size;
    ox = size >= W ? clamp(ox, W - size, 0) : (W - size) / 2;
    oy = size >= H ? clamp(oy, H - size, 0) : (H - size) / 2;
    const hx = ox + HEART[0] * size, hy = oy + HEART[1] * size;
    size *= zoom;
    return [hx - HEART[0] * size, hy - HEART[1] * size, size, size];
  }

  /* ---------- the magic ---------- */
  function setAwake(on) {
    const m = state.magic;
    if (m.awake === on || state.readyAt < 0) return;
    m.awake = on;
    m.since = state.t;
    m.burst = !on;
    state.fxTarget = 1;
    if (on) {
      m.quote = false;
      sound && sound.awaken();
    } else {
      particles.release();
      sound && sound.release();
      showQuote(false);
    }
    const btn = $('#magic');
    btn.setAttribute('aria-pressed', String(on));
    btn.querySelector('.label').textContent = on ? 'Відпустити магію' : 'Пробудити магію';
    document.body.classList.toggle('is-awake', on);
    updateHint();
  }

  function updateMagic(dt, env) {
    const m = state.magic, s = state.t - m.since;
    const out = { gather: 0, flash: 0, shock: 0, shockStrength: 0 };
    if (m.awake) {
      out.gather = s < 0.9 ? smooth(0, 0.75, s) : 0;
      if (!m.burst && s >= 0.9) {
        m.burst = true;
        particles.burst(env);
        sound && sound.burst();
      }
      if (s >= 0.9) {
        const b = s - 0.9;
        out.flash = (reducedMotion ? 0.15 : 0.42) * Math.min(1, b / 0.06) * Math.exp(-b * 4.5);
        out.shock = clamp01(b / 1.9);
        out.shockStrength = reducedMotion ? 0 : Math.pow(1 - out.shock, 1.4) * (b < 1.9 ? 1 : 0);
      }
      if (!m.quote && s > 2.4) { m.quote = true; showQuote(true); }
      if (m.quote && s > 11) showQuote(false);
    }
    m.level = damp(m.level, m.awake && s >= 0.9 ? 1 : 0, m.awake ? 1.3 : 1.1, dt);
    const target = m.awake && s > 1.1 ? 1 : 0;
    m.portalV += (4.5 * (target - m.portal) - 2.8 * m.portalV) * dt;
    m.portal = Math.max(0, m.portal + m.portalV * dt);
    if (!m.awake && m.portal < 0.002) { m.portal = 0; m.portalV = 0; }
    return out;
  }

  /* ---------- per-frame ---------- */
  let frameId = 0;
  const env = {
    t: 0, dt: 0, magic: 0, gather: 0, awake: false, heart: HEART, portal: 0, portalCentre: PORTAL,
    portalRadius: [0.28, 0.37], breeze: 0, leafRate: 0,
    density: { motes: 0, fireflies: 0, orbs: 0 },
    colours: { mote: [1, 1, 1], firefly: [1, 1, 1], orb: [1, 1, 1], inner: [1, 1, 1], outer: [1, 1, 1] },
    outline: [],
  };
  {
    const sil = PhotoAnalysis().SILHOUETTE;
    for (let i = 0; i < sil.length; i++) {
      const a = sil[i], b = sil[(i + 1) % sil.length];
      for (let k = 0; k < 4; k++) {
        const x = lerp(a[0], b[0], k / 4), y = lerp(a[1], b[1], k / 4);
        if (y < 590) env.outline.push([x / PHOTO, y / PHOTO]);
      }
    }
  }

  function loop(now) {
    frameId = requestAnimationFrame(loop);
    const t = now / 1000;
    const dt = state.last ? clamp(t - state.last, 0, 0.05) : 1 / 60;
    state.last = t;
    if (state.paused) return;
    adaptQuality(dt);
    simulate(dt);
    render();
  }

  // Adaptive resolution, measured once a second. A step down is kept only if it actually made
  // frames faster; otherwise the frame rate is capped elsewhere (e.g. a phone in power-saving
  // mode) and the full resolution comes back.
  function adaptQuality(dt) {
    if (state.fixedQuality) { state.quality = state.fixedQuality; return; }
    const p = state.perf;
    p.time += dt; p.frames++;
    if (p.time < 1) return;
    const avg = p.time / p.frames;
    p.time = 0; p.frames = 0;
    if (state.t < 3 || p.locked) return;
    if (p.trial) {
      if (avg > p.trial.avg * 0.92) { state.quality = p.trial.from; p.locked = true; }
      p.trial = null;
    } else if (avg > 0.024 && state.quality > 0.5) {
      p.trial = { avg, from: state.quality };
      state.quality = Math.max(0.5, state.quality - 0.1);
      p.good = 0;
    } else if (avg < 0.0135) {
      if (++p.good >= 3 && state.quality < 1) { state.quality = Math.min(1, state.quality + 0.05); p.good = 0; }
    } else p.good = 0;
  }

  const F = {}; // values shared between simulate() and render()

  function simulate(dt) {
    state.t += dt;
    if (state.shownAt < 0) state.shownAt = state.t;
    const t = state.t;
    resizeCanvas();
    const W = canvas.width, H = canvas.height;

    // intro: the plain photo first, then life, then the look
    const ready = state.readyAt >= 0;
    const sinceReady = ready ? t - state.readyAt : 0;
    const fade = smooth(0, 1.4, t - state.shownAt);
    const life = ready ? smooth(0.3, 4, sinceReady) * (reducedMotion ? 0.35 : 1) : 0;
    state.fx = damp(state.fx, state.fxTarget * (ready ? smooth(1.2, 7, sinceReady) : 0), state.magic.awake ? 2.5 : 1.2, dt);
    if (state.magic.awake) state.fx = Math.max(state.fx, Math.min(1, state.fx + dt * 0.8));

    // look transition
    const lt = easeInOut(clamp01((t - state.lookChangedAt) / 2.6));
    const target = [0, 0, 0];
    target[state.lookIndex] = 1;
    for (let i = 0; i < 3; i++) state.weights[i] = lerp(state.weightsFrom[i], target[i], lt);
    const L = blendLooks(state.weights, state.fx);

    // magic
    env.t = t; env.dt = dt;
    const M = updateMagic(dt, env);
    const mg = state.magic.level, portal = state.magic.portal, gather = M.gather;

    // camera
    const cam = state.cam;
    if (t - cam.lastInput > 2.5 && !state.gyro && !cam.hover) {
      cam.tx = damp(cam.tx, Math.sin(t * 0.13) * 0.55, 0.6, dt);
      cam.ty = damp(cam.ty, Math.sin(t * 0.093 + 1.3) * 0.32, 0.6, dt);
    }
    cam.x = damp(cam.x, cam.tx, 3.2, dt);
    cam.y = damp(cam.y, cam.ty, 3.2, dt);
    const intro = smooth(0, 16, sinceReady);
    cam.zoom = damp(cam.zoom, 1 + 0.035 * intro + 0.05 * mg + 0.012 * gather, 1.4, dt);
    const camAmt = life * (reducedMotion ? 0.3 : 1);
    const camVec = [cam.x * camAmt, cam.y * camAmt];

    // resolution
    const rect0 = photoRect(W, H, cam.zoom);
    const scale = Math.min(1, 1350 / rect0[2]) * state.quality;
    const sw = Math.max(2, Math.round(W * scale)), sh = Math.max(2, Math.round(H * scale));
    const rect = rect0.map((v) => v * scale);

    // derived look values with the magic applied
    const exposure = L.exposure * lerp(1, L.magicExposure, mg) * (1 - 0.18 * gather);
    const haze = mix3(L.haze, L.auraOuter.map((v) => v * 0.5), 0.35 * mg);
    const mist = mix3(L.mist, L.auraOuter.map((v) => v * 0.6), 0.3 * mg);
    const light = [lerp(L.light[0], PORTAL[0], clamp01(portal)), lerp(L.light[1], PORTAL[1] - 0.04, clamp01(portal))];
    const lightPx = [rect[0] + (light[0] - camVec[0] * PARALLAX * (0 - PIVOT)) * rect[2],
      rect[1] + (light[1] - camVec[1] * PARALLAX * (0 - PIVOT)) * rect[3]];
    const lightUv = [lightPx[0] / sw, 1 - lightPx[1] / sh];
    const rayColor = mix3(L.rayColor, L.auraInner.map((v) => v * 1.25 * state.fx), clamp01(portal) * 0.85);
    const lightDir = norm2([light[0] - HEART[0], light[1] - HEART[1]]);

    // particles
    env.magic = mg; env.gather = gather; env.awake = state.magic.awake; env.portal = portal;
    env.breeze = 0.004 * Math.sin(t * 0.11) + 0.002;
    env.leafRate = L.leafRate * life;
    env.density.motes = (L.motes + 0.3 * mg) * life;
    env.density.fireflies = (L.fireflies + 0.2 * mg * state.weights[2]) * life;
    env.density.orbs = (L.orbs + 0.4 * mg) * life;
    env.colours.mote = L.mote; env.colours.firefly = L.firefly; env.colours.orb = L.orb;
    env.colours.inner = L.auraInner; env.colours.outer = L.auraOuter;
    particles.update(env);
    Object.assign(F, { t, dt, W, H, sw, sh, rect, L, M, mg, portal, gather, fade, life, camVec, exposure, haze,
      mist, lightUv, rayColor, lightDir });
  }

  function render() {
    const { t, W, H, sw, sh, rect, L, M, mg, portal, gather, fade, life, camVec, exposure, haze, mist,
      lightUv, rayColor, lightDir } = F;
    const T = R.T;
    T.scene.resize(sw, sh);
    T.rays.resize(sw / 4, sh / 4);
    T.b1.resize(sw / 4, sh / 4); T.b1t.resize(sw / 4, sh / 4);
    T.b2.resize(sw / 8, sh / 8); T.b2t.resize(sw / 8, sh / 8);
    const quads = particles.write(L.leafLight);

    /* pass 1: the scene */
    const P = R.prog, X = R.tex;
    Engine.bindTarget(gl, T.scene);
    gl.disable(gl.BLEND);
    P.scene.use().set({
      uPhoto: X.photo, uPlate: X.plate, uPlateBlur: X.plateBlur, uAux: X.aux, uTiny: X.tiny, uNoise: X.noise,
      uRes: [sw, sh], uRect: rect, uTime: t, uCam: camVec, uPar: PARALLAX, uLife: life,
      uWind: 1 + 0.8 * mg,
      uBalance: L.balance, uGirlBalance: L.girlBalance, uGain: L.gain,
      uLift: mix3(L.lift, L.auraOuter.map((v) => v * 0.05), mg),
      uTone: [exposure, L.girlExposure * lerp(1, Math.max(1, L.magicExposure * 0.85), mg) * (1 - 0.1 * gather),
        L.contrast * (1 + 0.06 * mg), L.saturation * (1 + 0.14 * mg)],
      uSkyTop: [...L.skyTop, L.skyAmount], uSkyBottom: [...L.skyBottom, L.stars],
      uHaze: [...haze, L.hazeAmount], uMist: [...mist, L.mistAmount + 0.08 * mg * state.fx],
      uRim: [...L.rim, L.rimAmount], uLightDir: lightDir,
      uSpill: mix3(L.spill, L.auraInner.map((v) => v * 0.1), mg),
      uMagic: mg, uPortal: portal, uPortalC: PORTAL,
      uAura: [...L.auraInner, L.auraAmount], uAura2: L.auraOuter,
      uShock: [HEART[0], HEART[1], M.shock, M.shockStrength],
      uDof: 0.75 * mg, uGlints: mg * state.fx, uRaySky: L.raySky * (1 - 0.75 * clamp01(portal)),
    });
    R.fullscreen(P.scene);

    /* pass 2: particles into the scene (premultiplied; additive where alpha is 0) */
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.colorMask(true, true, true, false);
    P.particles.use().set({
      uPhoto: X.photo, uRes: [sw, sh], uRect: rect, uCam: camVec, uPar: PARALLAX,
      uFocus: GIRL_DEPTH, uDof: 40, uMaxSize: 150,
      uLeafGlow: L.leafGlow.map((v) => v * mg),
    });
    R.drawParticles(P.particles, quads, particles.verts);
    gl.colorMask(true, true, true, true);
    gl.disable(gl.BLEND);

    /* pass 3: bright pass at quarter resolution (alpha carries the light sources) */
    Engine.bindTarget(gl, T.b1);
    P.bright.use().set({ uTex: T.scene.tex, uTexel: [1 / sw, 1 / sh], uThreshold: L.threshold - 0.1 * mg });
    R.fullscreen(P.bright);

    /* pass 4: light shafts, radial blur toward the light */
    Engine.bindTarget(gl, T.rays);
    P.rays.use().set({
      uMask: T.b1.tex, uPhoto: X.photo, uLight: lightUv, uDensity: 0.95, uDecay: 0.982,
      uRect: [rect[0] / sw, rect[1] / sh, rect[2] / sw, rect[3] / sh],
      uGirlShift: [camVec[0] * PARALLAX * (GIRL_DEPTH - PIVOT), camVec[1] * PARALLAX * (GIRL_DEPTH - PIVOT)],
    });
    R.fullscreen(P.rays);

    /* pass 5: bloom, two octaves */
    blurPass(T.b1, T.b1t);
    Engine.bindTarget(gl, T.b2);
    P.down.use().set({ uTex: T.b1.tex, uTexel: [1 / T.b1.w, 1 / T.b1.h] });
    R.fullscreen(P.down);
    blurPass(T.b2, T.b2t);

    /* pass 6: final grade to the screen */
    Engine.bindTarget(gl, null, W, H);
    const aspect = W / H;
    P.final.use().set({
      uScene: T.scene.tex, uBloom1: T.b1.tex, uBloom2: T.b2.tex, uRays: T.rays.tex,
      uRes: [W, H], uAspect: aspect >= 1 ? [aspect, 1] : [1, 1 / aspect],
      uRayColor: rayColor.map((v) => v * (1 + 0.4 * mg)),
      uBloomK: [L.bloom[0] + 0.25 * mg, L.bloom[1] + 0.3 * mg],
      uSun: [...L.sun, L.sunAmount * (1 - 0.6 * mg)], uSunUv: lightUv,
      uVignette: L.vignette + 0.1 * mg + 0.2 * gather, uGrain: L.grain, uFade: fade,
      uFlash: M.flash, uAberration: L.aberration, uTonemap: state.fx, uTime: t,
    });
    R.fullscreen(P.final);

    if (sound) sound.update(state.weights, mg, F.dt);
  }

  function blurPass(a, tmp) {
    const P = R.prog;
    Engine.bindTarget(gl, tmp);
    P.blur.use().set({ uTex: a.tex, uDir: [1.4 / a.w, 0] });
    R.fullscreen(P.blur);
    Engine.bindTarget(gl, a);
    P.blur.use().set({ uTex: tmp.tex, uDir: [0, 1.4 / a.h] });
    R.fullscreen(P.blur);
  }

  function norm2(v) {
    const l = Math.hypot(v[0], v[1]) || 1;
    return [v[0] / l, v[1] / l];
  }

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(canvas.clientWidth * dpr));
    const h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  }

  /* ---------- input: pointer, touch, tilt, keyboard ---------- */
  function bindInput() {
    const cam = state.cam;
    let down = null;

    canvas.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'mouse') {
        cam.tx = clamp((e.clientX / innerWidth - 0.5) * 2, -1, 1);
        cam.ty = clamp((e.clientY / innerHeight - 0.5) * 2, -1, 1);
        cam.lastInput = state.t;
      } else if (down) {
        const dx = e.clientX - down.x, dy = e.clientY - down.y;
        if (Math.hypot(dx, dy) > 12) down.drag = true;
        if (down.drag) {
          cam.tx = clamp(down.tx + dx / (innerWidth * 0.45), -1, 1);
          cam.ty = clamp(down.ty + dy / (innerHeight * 0.45), -1, 1);
          cam.lastInput = state.t;
        }
      }
    });
    canvas.addEventListener('pointerdown', (e) => {
      down = { x: e.clientX, y: e.clientY, tx: cam.tx, ty: cam.ty, at: performance.now(), drag: false };
    });
    const up = (e) => {
      if (!down) return;
      const tap = !down.drag && performance.now() - down.at < 600;
      down = null;
      requestTilt();
      if (tap) onTap(e.clientX, e.clientY);
    };
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', () => { down = null; });
    canvas.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') cam.hover = true; });
    canvas.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') { cam.hover = false; cam.lastInput = -1e9; } });

    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
      if (e.key === '1' || e.key === '2' || e.key === '3') setLook(+e.key - 1);
      else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setAwake(!state.magic.awake); }
      else if (e.key === 'm' || e.key === 'M' || e.key === 'ь' || e.key === 'Ь') toggleSound();
    });
  }

  function onTap(clientX, clientY) {
    if (!state.magic.awake) { setAwake(true); return; }
    if (state.t - state.magic.since < 1.2) return;
    const rect = canvas.getBoundingClientRect();
    const W = canvas.width, H = canvas.height;
    const r = photoRect(W, H, state.cam.zoom);
    const px = ((clientX - rect.left) / rect.width) * W, py = ((clientY - rect.top) / rect.height) * H;
    particles.sparkle((px - r[0]) / r[2], (py - r[1]) / r[3], env);
    sound && sound.sparkle();
  }

  // Tilt: iOS asks for permission inside a gesture; elsewhere the events simply arrive.
  let tiltAsked = false;
  function requestTilt() {
    if (tiltAsked) return;
    tiltAsked = true;
    const DOE = window.DeviceOrientationEvent;
    if (!DOE) return;
    if (typeof DOE.requestPermission === 'function') {
      DOE.requestPermission().then((r) => { if (r === 'granted') listenTilt(); }).catch(() => {});
    } else listenTilt();
  }

  function listenTilt() {
    const cam = state.cam;
    let base = null;
    window.addEventListener('deviceorientation', (e) => {
      if (e.beta == null || e.gamma == null) return;
      const angle = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
      let x = e.gamma, y = e.beta;
      if (angle === 90) { x = e.beta; y = -e.gamma; } else if (angle === -90 || angle === 270) { x = -e.beta; y = e.gamma; }
      if (!base) base = { x, y };
      base.x += (x - base.x) * 0.004;
      base.y += (y - base.y) * 0.004;
      cam.tx = clamp((x - base.x) / 18, -1, 1);
      cam.ty = clamp((y - base.y) / 18, -1, 1);
      cam.lastInput = state.t;
      state.gyro = true;
    });
  }

  /* ---------- interface ---------- */
  function bindUi() {
    $$('.looks button').forEach((b) => b.addEventListener('click', () => setLook(LOOK_NAMES.indexOf(b.dataset.look))));
    $('#magic').addEventListener('click', () => { requestTilt(); setAwake(!state.magic.awake); });
    const snd = $('#sound');
    if (sound) snd.addEventListener('click', toggleSound); else snd.hidden = true;
    document.addEventListener('visibilitychange', () => sound && sound.pause(document.hidden));
    updateHint();
  }

  function setLook(i) {
    if (i === state.lookIndex || i < 0) return;
    state.weightsFrom = state.weights.slice();
    state.lookIndex = i;
    state.lookChangedAt = state.t;
    state.fxTarget = 1;
    $$('.looks button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.look === LOOK_NAMES[i])));
    sound && sound.setLook(LOOK_NAMES[i]);
  }

  function toggleSound() {
    if (!sound) return;
    const on = !sound.enabled;
    sound.enable(on);
    $('#sound').setAttribute('aria-pressed', String(on));
    $('#sound .label').textContent = on ? 'Звук увімкнено' : 'Звук';
  }

  function updateHint() {
    const hint = $('#hint');
    const awake = state.magic.awake;
    hint.querySelector('.primary').textContent = awake
      ? (coarsePointer ? 'Торкайтеся сцени, щоб розсипати світло' : 'Клацайте по сцені, щоб розсипати світло')
      : (coarsePointer ? 'Торкніться, щоб пробудити магію' : 'Клацніть, щоб пробудити магію');
    hint.querySelector('.secondary').textContent = coarsePointer
      ? 'Нахиліть телефон або ведіть пальцем, щоб зазирнути вглиб'
      : 'Рухайте мишею, щоб зазирнути вглиб сцени';
  }

  function showQuote(on) {
    $('#quote').classList.toggle('is-visible', on);
    document.body.classList.toggle('quote-on', on);
  }

  // Test hook (only with ?debug): fast-forward the timeline without real time passing.
  if (params.has('debug')) {
    window.__forest = {
      ready: () => state.readyAt >= 0,
      pause: (on) => { state.paused = on; },
      skip: (seconds, step = 1 / 30) => { for (let s = 0; s < seconds; s += step) simulate(step); render(); },
      look: (i) => setLook(i),
      awake: (on) => setAwake(on),
      tap: (x, y) => onTap(x, y),
      cam: (x, y) => { state.cam.tx = x; state.cam.ty = y; state.cam.x = x; state.cam.y = y; state.cam.lastInput = state.t + 1e6; },
      state,
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
